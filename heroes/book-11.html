<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Squad</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#fff;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#0f8a96,#0b6d80 55%,#07505f)}
.fl{position:fixed;animation:bob ease-in-out infinite alternate;pointer-events:none;opacity:.75}
@keyframes bob{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-26px) rotate(10deg)}}
h1{font-family:'Luckiest Guy',cursive;font-size:36px;color:#ffb12e;-webkit-text-stroke:1.5px #5a2e8a;text-shadow:3px 3px 0 #5a2e8a;margin-bottom:16px;position:relative;z-index:5}
.cover{background:url('img/b11.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#5a2e8a,#2c1245);border:2px solid #ffb12e}
.pg{background:#f2fbfc;color:#0b5560;padding:24px 22px;display:flex;flex-direction:column}
.pg h2{font-family:'Luckiest Guy',cursive;font-size:23px;color:#0f8a96;text-align:center;margin-bottom:12px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,#bfe3e8 30px 31px);border-radius:4px}
.taz{background:#fbf6e8;color:#6b4a2a}
.taz h2{color:#a8762e}
.taz .lin{background:repeating-linear-gradient(transparent 0 30px,#e3d3b4 30px 31px)}
.ninja{background:#12351c;color:#bfe8c8}
.ninja h2{color:#6fdc5a;-webkit-text-stroke:1px #0a2010}
.ninja .lin{background:repeating-linear-gradient(transparent 0 30px,rgba(111,220,90,.3) 30px 31px)}
.ninja::before{content:'';display:block;height:14px;border-radius:8px;margin-bottom:10px;background:repeating-linear-gradient(90deg,#6fdc5a 0 26px,#49b83e 26px 52px)}
.jungle{background:#eefbe8;color:#2e6b1e}
.jungle h2{color:#3f9426}
.jungle .lin{background:repeating-linear-gradient(transparent 0 30px,#c4e6b2 30px 31px)}
.clue{display:flex;align-items:flex-end;gap:8px;margin:9px 0;font-weight:700;font-size:14px}
.clue input{flex:1;border-bottom:2px dotted #7bc4cc;font-size:14px;color:#0b5560}
.inback{background:linear-gradient(140deg,#43206b,#1c0a30);display:flex;align-items:center;justify-content:center;font-size:44px}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="fl" style="top:12%;left:6%;font-size:30px;animation-duration:4s">🌼</span>
<span class="fl" style="top:64%;left:8%;font-size:28px;animation-duration:5s">🔍</span>
<span class="fl" style="top:18%;right:7%;font-size:28px;animation-duration:4.4s">🌸</span>
<span class="fl" style="top:70%;right:9%;font-size:26px;animation-duration:5.4s">🐾</span>
<h1>MYSTERY SQUAD 🔍</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Mystery Notes 🔍</h2>
 <div class="clue">📋 Affaire N°:<input></div><div class="clue">👣 Suspect:<input></div>
 <div class="lin" style="margin-top:6px"></div></div></div>
<div class="sheet"><div class="face front pg taz"><h2>🌀 Spin &amp; Chaos</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-weight:700;letter-spacing:2px">···· SPIN · WRITE · CHAOS · FUN ····</div></div>
 <div class="face back pg ninja"><h2>🐢 Ninja Notes</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🍕 COWABUNGA! 🛹</div></div></div>
<div class="sheet"><div class="face front pg jungle"><h2>🐆 Jungle Explorer</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🌿 🦜 🌺</div></div>
 <div class="face back inback">🔍✨</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
