<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Magical Stars</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;color:#fff;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#b58ae8,#9a6ad8 45%,#e88ac2)}
.st{position:fixed;animation:tw ease-in-out infinite alternate;pointer-events:none}
@keyframes tw{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.2)}}
h1{font-family:'Dancing Script',cursive;font-size:44px;color:#fff;text-shadow:0 0 18px rgba(255,210,255,.9),0 2px 0 #8a4fc2;margin-bottom:14px;position:relative;z-index:5}
.cover{background:url('img/b15.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#6a3aa8,#32154e);border:2px solid #f0c8ff}
.pg{background:#fdf6ff;color:#6a3aa8;padding:24px 22px;display:flex;flex-direction:column}
.pg h2{font-family:'Dancing Script',cursive;font-size:30px;color:#9a4fd0;text-align:center;margin-bottom:10px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,#e2cef5 30px 31px);border-radius:4px}
.idol{background:linear-gradient(160deg,#eadff8,#d8c2f0);color:#5a2a8a}
.idol .lin{background:repeating-linear-gradient(transparent 0 30px,rgba(138,80,200,.3) 30px 31px)}
.puppy{background:#ffeef5;color:#c2447a}
.puppy h2{color:#e45f94}
.puppy .lin{background:repeating-linear-gradient(transparent 0 30px,#f5c6da 30px 31px)}
.love{background:#fffdf6;color:#8a3030}
.love h2{color:#c23a3a;font-family:'Dancing Script',cursive}
.love .lin{background:repeating-linear-gradient(transparent 0 32px,rgba(194,58,58,.35) 32px 33px)}
.inback{background:linear-gradient(140deg,#5a2a92,#28103f);display:flex;align-items:center;justify-content:center;font-size:30px;color:#f0d0ff;font-family:'Dancing Script',cursive;text-align:center}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<h1>Magical Stars 🌙</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Moon Notes 🌙</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🎀 ⭐ 💖</div></div></div>
<div class="sheet"><div class="face front pg idol"><h2>Star Idols 🎤</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🎵 👑 💎 🎶</div></div>
 <div class="face back pg puppy"><h2>Puppy Love 🐶</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🌼 🍒 🎀 🐾</div></div></div>
<div class="sheet"><div class="face front pg love"><h2>Love Letter 💌</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:10px;font-family:'Dancing Script',cursive;font-size:24px;color:#c23a3a">Love You ❤</div></div>
 <div class="face back inback">xoxo 🌙<br>stay magical</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();

for(let i=0;i<34;i++){const s=document.createElement('span');s.className='st';s.textContent=['✦','⭐','🌙','💜','✧'][i%5];s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.fontSize=(10+Math.random()*16)+'px';s.style.animationDuration=(1.4+Math.random()*2.6)+'s';s.style.animationDelay=(-Math.random()*3)+'s';document.body.appendChild(s);}
</script></body></html>
