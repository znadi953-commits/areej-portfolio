<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heart Blooms — Cardiac Care Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;position:relative;overflow:hidden;color:#fff}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.logo{position:absolute;top:30px;right:40px;z-index:3;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.title{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;font-weight:300;font-size:clamp(42px,7.4vw,96px);line-height:1.12;letter-spacing:-.01em;text-shadow:0 4px 40px rgba(40,60,140,.35);animation:fade 1.4s ease both}
@keyframes fade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.w{position:absolute;z-index:3;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.65);border-radius:18px;padding:14px 16px;color:#1c2b4a;box-shadow:0 14px 40px rgba(30,50,120,.18);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.w h5{font-size:11px;font-weight:600;margin-bottom:6px}
.w .big{font-size:22px;font-weight:600}
.w small{font-size:9.5px;color:#5a6a8c;display:block}
.w1{left:5%;top:9%} .w2{left:4%;top:56%;animation-delay:1.1s} .w3{right:6%;top:30%;animation-delay:2s;max-width:200px} .w4{right:5%;bottom:9%;animation-delay:.6s}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(#4f7dfb 0 78%,#dfe7fb 0);display:grid;place-items:center;margin-top:6px}
.ring i{width:40px;height:40px;background:#fff;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#4f7dfb}
.bar{height:6px;border-radius:4px;background:#dfe7fb;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:54%;background:linear-gradient(90deg,#4f7dfb,#9f6dfb);animation:grow 2.4s ease both}
@keyframes grow{from{width:0}}
</style></head><body>
<img class="bg" src="img/h8.jpg" alt="">
<div class="logo">🌱 Heart Blooms</div>
<div class="title">Revolutionizing<br>Cardiac Care</div>
<div class="w w1"><h5>Recovery goal</h5><div class="ring"><i>+25%</i></div><small>Get better by +25%</small></div>
<div class="w w2"><h5>Analysis of the day</h5><div class="big">54.00%</div><div class="bar"><i></i></div><small>+5% vs yesterday</small></div>
<div class="w w3"><h5>Doctor's session</h5><div class="big">75%</div><small>Started yesterday · ECG monitoring stable</small></div>
<div class="w w4"><h5>Scheduled visits</h5><div class="big">14:30</div><small>Dr. Amrani — cardiology</small></div>
</body></html>
