<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocky World</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#eafbe8;overflow:hidden;padding:40px 0;background:linear-gradient(180deg,#78c8f0 0 38%,#5aa84e 38% 44%,#6b4a2e 44% 100%)}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,0,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.07) 1px,transparent 1px);background-size:38px 38px;pointer-events:none}
.fl{position:fixed;animation:bob ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-20px)}}
h1{font-family:'Luckiest Guy',cursive;font-size:34px;color:#dfe8df;text-shadow:3px 3px 0 #3a3a3a,-1px -1px 0 #888;letter-spacing:2px;margin-bottom:16px;position:relative;z-index:5}
.cover{background:url('img/b16.jpg') center/cover}
.backboard{background:#4a3categ420;background:#4a3420;border:3px solid #2c1f12}
.face{border-radius:0!important}
.backboard{border-radius:0}
.pg{background:#f5eddc;color:#4a3a22;padding:22px 20px;display:flex;flex-direction:column}
.pg h2{font-family:'Luckiest Guy',cursive;font-size:22px;color:#5aa84e;-webkit-text-stroke:1px #2c4a22;text-align:center;margin-bottom:10px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,#d8c9a8 30px 31px);border-radius:0}
.craft{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin:12px 0}
.craft span{width:64px;height:64px;background:#8a8a8a;border:4px solid;border-color:#5a5a5a #cfcfcf #cfcfcf #5a5a5a}
.inv{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.inv span{aspect-ratio:1;background:#9a9a9a;border:3px solid;border-color:#6a6a6a #d8d8d8 #d8d8d8 #6a6a6a;display:flex;align-items:center;justify-content:center;font-size:18px}
.tk{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:15px;font-weight:700}
.tk input[type=checkbox]{width:17px;height:17px;accent-color:#5aa84e}
.tk input[type=text]{flex:1;border-bottom:2px dotted #a89a6e;font-size:14px;color:#4a3a22}
.inback{background:#2c1f12;display:flex;align-items:center;justify-content:center;font-size:44px}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="fl" style="top:10%;left:6%;font-size:28px;animation-duration:4s">☁️</span>
<span class="fl" style="top:16%;right:7%;font-size:26px;animation-duration:5s">🐝</span>
<span class="fl" style="top:66%;left:8%;font-size:26px;animation-duration:4.4s">⛏️</span>
<span class="fl" style="top:70%;right:9%;font-size:24px;animation-duration:5.2s">💎</span>
<h1>BLOCKY WORLD ⛏️</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Blocky Notes ⛏️</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:20px">🐷 🐑 🌳 💎</div></div></div>
<div class="sheet"><div class="face front pg"><h2>Crafting 🔨</h2>
 <div class="craft"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
 <div style="text-align:center;font-weight:700">→ Résultat: ❓</div>
 <div class="inv"><span>⛏️</span><span>🗡️</span><span>🪓</span><span>🎣</span><span>🧱</span><span>💎</span><span>🪵</span><span>🍖</span><span>🧪</span><span>🛡️</span><span>🏹</span><span>🔥</span></div></div>
 <div class="face back pg"><h2>Quest Log 🗺️</h2>
 <div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="quête..."></div>
 <div style="text-align:center;margin-top:auto;font-weight:800;color:#5aa84e">XP: ▓▓▓▓▓░░░ 62%</div></div></div>
<div class="sheet"><div class="face front pg"><h2>Notes du Mineur 📜</h2><div class="lin"></div></div>
 <div class="face back inback">⛏️💎</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
