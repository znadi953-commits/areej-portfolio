<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Glam Girlz</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;color:#fff;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#ffd4ea,#ff9cce 55%,#f767b4)}
.gl{position:fixed;animation:fl ease-in-out infinite alternate;pointer-events:none;opacity:.6}
@keyframes fl{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(8deg)}}
h1{font-family:'Luckiest Guy',cursive;font-size:38px;color:#ff2d9c;-webkit-text-stroke:1.5px #7c0a4a;text-shadow:3px 3px 0 #ffd4ea;margin-bottom:16px;z-index:5;position:relative}
.cover{background:url('img/b7.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#a3105f,#5a0834);border:2px solid #ffb5dd}
.pg{background:#fff2f9;color:#a3105f;padding:24px 22px;display:flex;flex-direction:column}
.pg h2{font-family:'Luckiest Guy',cursive;font-size:22px;color:#ff2d9c;text-align:center;margin-bottom:12px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,#f7bddd 30px 31px);border-radius:4px}
.fit{border:2.5px solid #ff2d9c;border-radius:14px;background:#fff;padding:10px 14px;margin:8px 0;display:flex;align-items:flex-end;gap:8px;font-weight:700;font-size:14px}
.fit input{flex:1;border-bottom:2px dotted #f78cc5;font-size:14px;color:#a3105f}
.tk{display:flex;align-items:center;gap:9px;margin:10px 0}
.tk input[type=checkbox]{width:17px;height:17px;accent-color:#ff2d9c}
.tk input[type=text]{flex:1;border-bottom:2px dotted #f78cc5;font-size:15px;color:#a3105f}
.inback{background:linear-gradient(140deg,#8c0c50,#43052a);display:flex;align-items:center;justify-content:center;font-size:30px;color:#ffc6e4;font-family:'Luckiest Guy',cursive;text-align:center}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="gl" style="top:12%;left:7%;font-size:32px;animation-duration:4s">💋</span>
<span class="gl" style="top:66%;left:9%;font-size:26px;animation-duration:5s">⭐</span>
<span class="gl" style="top:20%;right:8%;font-size:28px;animation-duration:4.4s">👑</span>
<span class="gl" style="top:72%;right:9%;font-size:28px;animation-duration:5.2s">🕶️</span>
<h1>GLAM GIRLZ</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Glam Notes 💋</h2><div class="lin"></div></div></div>
<div class="sheet"><div class="face front pg"><h2>Fits &amp; Looks 👛</h2>
 <div class="fit">👚 Top:<input></div><div class="fit">👖 Bottom:<input></div>
 <div class="fit">👢 Shoes:<input></div><div class="fit">💍 Accessoires:<input></div>
 <div class="fit">💄 Makeup:<input></div>
 <div style="text-align:center;margin-top:auto;font-size:28px">💋 ⭐ 👑</div></div>
 <div class="face back pg"><h2>Slay List ✓</h2>
 <div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div><div class="tk"><input type="checkbox"><input type="text"></div></div></div>
<div class="sheet"><div class="face front pg"><h2>Diary of a Queen 📓</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:10px;font-size:24px">💅 ✨</div></div>
 <div class="face back inback">stay glam ✨<br>xoxo</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
