<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura store — E-commerce Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#efe9df;color:#141414;font-family:'JetBrains Mono',monospace;min-height:100vh;overflow-x:hidden}
nav{display:flex;align-items:center;gap:26px;padding:24px 4vw;font-size:13px}
nav .lg{font-weight:700;line-height:1.1;margin-right:auto}nav .lg i{font-style:normal}
nav a{color:#141414;text-decoration:none;opacity:.7}nav a:hover{opacity:1}
nav a.on{opacity:1;font-weight:700}
.id{font-size:11px;opacity:.6}
.stage{position:relative;text-align:center}
.split{font-family:'Space Grotesk';font-weight:700;font-size:clamp(60px,13.5vw,180px);letter-spacing:-.02em;display:flex;justify-content:center;gap:24vw;line-height:1;animation:up 1s ease both}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.person{position:relative;margin:-11vw auto 0;width:min(430px,52vw);display:block;z-index:2;animation:up 1.1s .2s ease both}
.left{position:absolute;left:4vw;top:46%;max-width:260px;text-align:left;z-index:3}
.left h3{font-family:'Space Grotesk';font-size:24px;line-height:1.25;margin:14px 0}
.left p{font-size:11.5px;line-height:1.8;opacity:.75}
.ic{width:40px;height:40px;border:1.5px solid #141414;border-radius:10px;display:grid;place-items:center;font-size:18px}
.right{position:absolute;right:4vw;top:42%;width:230px;z-index:3;text-align:center}
.pcard{background:#fff;border:1.5px solid #141414;border-radius:18px;padding:14px;box-shadow:6px 6px 0 #141414;transition:.3s}
.pcard:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 #141414}
.pcard img{width:100%;height:150px;object-fit:cover;object-position:50% 20%;border-radius:10px;filter:saturate(.9)}
.pcard span{display:block;margin-top:8px;font-size:12px;font-weight:700}
.cta{display:inline-block;margin-top:14px;border:1.5px solid #141414;border-radius:999px;padding:11px 22px;font-size:12px;text-decoration:none;color:#141414;background:#efe9df;transition:.25s}
.cta:hover{background:#141414;color:#efe9df}
</style></head><body>
<nav><div class="lg">Aura<br>store <i>✦</i></div><a class="on" href="#">main</a><a href="#">shop</a><a href="#">custom</a><a href="#">about</a><a href="#">contact</a><span class="id">account id — 003.201</span></nav>
<div class="stage">
<div class="split"><span>Aura</span><span>store</span></div>
<div class="left"><div class="ic">⟲</div><h3>Clothes without excess. Only style.</h3><p>Modern silhouettes, natural fabrics, and honest design. For those who choose simplicity and quality.</p></div>
<div class="right"><div class="pcard"><img src="img/h5.jpg" alt=""><span>2026</span></div><a class="cta" href="#">new collection ↗</a></div>
<img class="person" src="img/h5.jpg" alt="">
</div></body></html>
