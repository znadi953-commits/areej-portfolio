<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMERGE — Next Begins Here</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;min-height:100vh;padding:18px}
.grid{position:relative;max-width:1150px;margin:0 auto;border-radius:28px;overflow:hidden;background:#000;min-height:92vh}
.grid img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.card{position:absolute;background:#fff;color:#0a0a0a;border-radius:999px;display:flex;align-items:center;gap:10px;padding:14px 26px;font-weight:600;z-index:4;animation:pop .8s ease both}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.logo{left:22px;top:22px;font-family:Orbitron;letter-spacing:.2em}
.contact{right:22px;top:22px;animation-delay:.15s}.contact:hover{background:#e8e8e8}
.quote{position:absolute;right:22px;top:100px;max-width:300px;background:rgba(0,0,0,.55);border:1px dashed rgba(255,255,255,.5);border-radius:16px;padding:16px 18px;font-size:13px;line-height:1.6;z-index:4;backdrop-filter:blur(4px);animation:pop .8s .3s ease both}
.title{position:absolute;left:30px;bottom:30px;z-index:4;font-family:Orbitron;font-weight:800;font-size:clamp(40px,7.2vw,92px);line-height:1.02;letter-spacing:.02em;animation:slideR 1s .2s ease both}
@keyframes slideR{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:translateX(0)}}
.small{position:absolute;left:30px;top:38%;font-size:11px;color:#cfcfcf;max-width:170px;line-height:1.7;z-index:4}
.explore{position:absolute;right:22px;top:46%;z-index:4;animation-delay:.45s}
.explore b{background:#0a0a0a;color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.mini{position:absolute;right:22px;bottom:22px;width:230px;background:#0d0d0d;border:1px solid #2c2c2c;border-radius:20px;padding:14px;z-index:4;animation:pop .8s .5s ease both}
.mini img{width:100%;border-radius:12px;display:block;margin-bottom:10px;height:110px;object-fit:cover;object-position:top}
.mini p{font-size:11px;color:#bdbdbd;line-height:1.5}
.arrow{position:absolute;right:14px;top:14px;background:#fff;color:#000;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700}
</style></head><body>
<div class="grid">
<img class="bg" src="img/h4.jpg" alt="">
<div class="card logo">EMERGE</div>
<a class="card contact" href="#">🔍 &nbsp; Contact &nbsp; 🛒</a>
<div class="quote">Where traditional boundaries dissolve and digital dreams take shape.</div>
<div class="small">My art doesn't just look forward — it pulls the future closer.</div>
<a class="card explore" href="#">Start Exploring <b>→</b></a>
<div class="title">NEXT<br>BEGINS<br>HERE</div>
<div class="mini"><span class="arrow">↗</span><img src="img/h4.jpg" alt=""><p>Let the future emerge through your art</p></div>
</div></body></html>
