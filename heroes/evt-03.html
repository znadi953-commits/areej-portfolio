<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitation Royale — AREEJ Events</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#0c0a08;min-height:100vh;font-family:Inter,sans-serif;color:#e9d9b8;display:flex;align-items:center;justify-content:center;padding:3vmin;overflow:hidden}
.card{position:relative;width:min(88%,620px);aspect-ratio:3/4.1;background:radial-gradient(110% 80% at 50% 0%,#201a10,#140f08 55%,#0c0906);border-radius:16px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.85),inset 0 0 0 1px rgba(216,180,100,.25);animation:in 1.2s ease both}
@keyframes in{from{opacity:0;transform:translateY(40px) rotate(-1deg)}to{opacity:1;transform:none}}
.bord{position:absolute;inset:18px;border:1px solid rgba(216,180,100,.5);border-radius:10px;pointer-events:none}
.bord::after{content:"";position:absolute;inset:6px;border:1px solid rgba(216,180,100,.25);border-radius:7px}
.crn{position:absolute;font-size:18px;color:#d8b464;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.c1{left:26px;top:24px}.c2{right:26px;top:24px}.c3{left:26px;bottom:24px}.c4{right:26px;bottom:24px}
.mono{position:absolute;left:50%;top:11%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;border:1px solid rgba(216,180,100,.6);display:grid;place-items:center;font-family:'Cormorant Garamond';font-size:30px;color:#efd9a4;animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(216,180,100,0)}50%{box-shadow:0 0 30px 4px rgba(216,180,100,.3)}}
h1{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-family:'Cormorant Garamond';font-weight:500;font-size:clamp(30px,5.6vw,46px);white-space:nowrap;background:linear-gradient(110deg,#9a7a3a,#f2dc9e 30%,#b8913e 55%,#f6e6b4 80%,#9a7a3a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gold 6s linear infinite}
@keyframes gold{to{background-position:-200% 0}}
.it{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:'Cormorant Garamond';font-style:italic;font-size:15px;color:#c9b183}
.sep{position:absolute;left:30%;right:30%;top:47.5%;height:1px;background:linear-gradient(90deg,transparent,#d8b464,transparent);animation:lw 2.4s .4s ease both}
@keyframes lw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.txt{position:absolute;left:14%;right:14%;top:52%;text-align:center;font-size:11px;font-weight:300;line-height:2.1;color:#cbb econ;color:#cbb389;animation:fade 1.4s .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.txt b{color:#efd9a4;font-weight:400;letter-spacing:.14em}
.rsvp{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:10px;letter-spacing:.4em;color:#e9d9b8;border:1px solid rgba(216,180,100,.6);border-radius:24px;padding:12px 30px;text-decoration:none;transition:.35s;animation:fade 1.4s .9s ease both}
.rsvp:hover{background:rgba(216,180,100,.14);letter-spacing:.5em}
.pt{position:absolute;width:3px;height:3px;border-radius:50%;background:#e8c87a;opacity:0;animation:floatp 6s linear infinite}
@keyframes floatp{0%{opacity:0;transform:translateY(16px)}14%{opacity:.9}100%{opacity:0;transform:translateY(-240px)}}
</style></head><body>
<div class="card">
  <span class="bord"></span>
  <span class="crn c1">✦</span><span class="crn c2" style="animation-delay:.7s">✦</span><span class="crn c3" style="animation-delay:1.4s">✦</span><span class="crn c4" style="animation-delay:2.1s">✦</span>
  <div class="mono">A</div>
  <h1>Soirée Royale</h1>
  <div class="it">Vous êtes cordialement invités</div>
  <span class="sep"></span>
  <p class="txt"><b>SAMEDI 20 JUIN 2026 · 20H</b><br>Riad AREEJ — Casablanca<br>Dîner aux chandelles · Orchestre live · Dress code : Or &amp; Noir</p>
  <a class="rsvp" href="#">R S V P</a>
  <span class="pt" style="left:16%;animation-delay:0s;top:80%"></span>
  <span class="pt" style="left:36%;animation-delay:1.8s;top:85%"></span>
  <span class="pt" style="left:62%;animation-delay:.9s;top:82%"></span>
  <span class="pt" style="left:84%;animation-delay:2.6s;top:86%"></span>
</div></body></html>
