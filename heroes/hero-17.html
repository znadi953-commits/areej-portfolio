<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASH KINGS — Art Print</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#0a0a0a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3vmin;font-family:Inter,sans-serif;color:#d8b35a}
.frame{position:relative;width:100%;max-width:1060px;aspect-ratio:16/9.2;background:
 radial-gradient(90% 120% at 50% 0%,#17120a 0%,#0b0906 60%,#060504 100%);
 overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.85)}
.bord{position:absolute;inset:16px;border:2px solid #b4913f;pointer-events:none;z-index:6}
.bord::after{content:"";position:absolute;inset:7px;border:1px solid rgba(216,179,90,.55)}
.corner{position:absolute;font-family:'Playfair Display';font-weight:900;font-size:clamp(28px,4vw,52px);z-index:7;background:linear-gradient(120deg,#8c6c24,#f0d488 40%,#a8842e 70%,#f6e3a4);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gold 5s linear infinite}
@keyframes gold{to{background-position:-200% 0}}
.c1{left:34px;top:26px}.c2{right:34px;top:26px}.c3{left:34px;bottom:26px}.c4{right:34px;bottom:26px}
h1{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-family:'Playfair Display';font-weight:900;font-size:clamp(34px,5.4vw,66px);letter-spacing:.1em;white-space:nowrap;z-index:5;background:linear-gradient(120deg,#8c6c24,#f6e3a4 35%,#a8842e 60%,#f6e3a4);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gold 5s linear infinite}
.sub{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:'Space Mono';font-size:10px;letter-spacing:.5em;color:#8f7b4a;z-index:5}
.rab{position:absolute;left:50%;bottom:0;height:72%;transform:translateX(-50%);z-index:4;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8));animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-14px)}}
.glow{position:absolute;left:50%;bottom:-18%;width:60%;aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(circle,rgba(216,179,90,.22) 0%,transparent 60%);z-index:3;animation:gpulse 4.5s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.6}50%{opacity:1}}
.bill{position:absolute;top:-12%;width:34px;height:16px;border-radius:2px;background:linear-gradient(135deg,#9fc29a,#5f8f62);border:1px solid #3c5c40;z-index:2;opacity:0;animation:fall 6s linear infinite}
.bill::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;color:#24381f}
@keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}8%{opacity:.95}100%{opacity:0;transform:translateY(640px) rotate(320deg)}}
.chips{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:12px;z-index:8}
.chip{font-family:'Space Mono';font-size:9px;letter-spacing:.26em;border:1px solid rgba(216,179,90,.6);color:#e9cf85;padding:8px 16px;background:rgba(10,8,4,.7);backdrop-filter:blur(4px)}
.chip.gold{background:linear-gradient(120deg,#8c6c24,#d8b35a);color:#140f05;font-weight:700}
.wm{position:absolute;right:5%;top:40%;writing-mode:vertical-rl;font-family:'Space Mono';font-size:9px;letter-spacing:.4em;color:#6b5a30;z-index:5}
.wm2{position:absolute;left:5%;top:40%;writing-mode:vertical-rl;transform:rotate(180deg);font-family:'Space Mono';font-size:9px;letter-spacing:.4em;color:#6b5a30;z-index:5}
</style></head><body>
<div class="frame">
  <span class="bord"></span>
  <span class="corner c1">100</span><span class="corner c2">100</span><span class="corner c3">100</span><span class="corner c4">100</span>
  <h1>CASH&nbsp;KINGS</h1>
  <div class="sub">FEDERAL RESERVE OF STYLE — AREEJ</div>
  <span class="wm">LEGAL TENDER · ART PRINT</span><span class="wm2">LIMITED EDITION · №100</span>
  <span class="glow"></span>
  <i class="bill" style="left:14%;animation-delay:0s"></i>
  <i class="bill" style="left:24%;animation-delay:2.2s"></i>
  <i class="bill" style="left:70%;animation-delay:1s"></i>
  <i class="bill" style="left:82%;animation-delay:3.4s"></i>
  <i class="bill" style="left:60%;animation-delay:4.6s"></i>
  <img class="rab" src="img/h17.jpg" style="mix-blend-mode:lighten" alt="">
  <div class="chips"><span class="chip gold">ART PRINT ✦ 100</span><span class="chip">AREEJ ORIGINALS</span></div>
</div></body></html>
