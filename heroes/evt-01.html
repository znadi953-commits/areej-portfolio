<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYE 2027 — Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&family=Inter:wght@300&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#05060f;min-height:100vh;font-family:Inter,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:3vmin;overflow:hidden}
.sky{position:relative;width:min(96%,1060px);aspect-ratio:16/9.6;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 110%,#1a1040 0%,#0b0a22 50%,#04050e 100%);box-shadow:0 36px 86px rgba(0,0,0,.8)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.fw{position:absolute;width:4px;height:4px}
.fw i{position:absolute;left:0;top:0;width:4px;height:4px;border-radius:50%;background:var(--c);animation:burst 2.8s ease-out infinite;animation-delay:var(--d)}
@keyframes burst{0%,54%{transform:translate(0,0);opacity:0}56%{opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
.rocket{position:absolute;bottom:0;width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,#ffd77a,transparent);animation:rise 2.8s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}52%{transform:translateY(-290px);opacity:1}56%,100%{opacity:0}}
h1{position:absolute;left:50%;top:13%;transform:translateX(-50%);font-family:Unbounded;font-weight:800;font-size:clamp(26px,4.4vw,46px);text-align:center;line-height:1.3;z-index:6}
h1 small{display:block;font-size:10px;font-weight:400;letter-spacing:.6em;color:#9fa6d8;margin-top:8px}
.cd{position:absolute;left:50%;top:48%;transform:translateX(-50%);display:flex;gap:14px;z-index:6}
.cell{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:16px;padding:16px 18px;text-align:center;min-width:86px;animation:up 1s ease both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.cell b{font-family:Unbounded;font-size:clamp(22px,3.4vw,36px);display:block}
.cell small{font-size:8.5px;letter-spacing:.3em;color:#9fa6d8}
.cta{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:6;background:linear-gradient(120deg,#ffd77a,#ff9a5c);color:#2a1604;font-size:11.5px;font-weight:800;letter-spacing:.1em;padding:14px 32px;border-radius:28px;text-decoration:none;animation:pu 2.2s infinite;transition:.3s}
.cta:hover{transform:translateX(-50%) scale(1.08)}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(255,195,100,.45)}50%{box-shadow:0 0 0 12px rgba(255,195,100,0)}}
.moon{position:absolute;right:7%;top:10%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff8e8,#e8d9ad);box-shadow:0 0 40px rgba(255,240,200,.45);animation:bobm 7s ease-in-out infinite}
@keyframes bobm{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style></head><body>
<div class="sky" id="sky">
  <span class="moon"></span>
  <h1>RÉVEILLON 2027<small>CASABLANCA · ROOFTOP AREEJ</small></h1>
  <div class="cd">
    <div class="cell" style="animation-delay:.1s"><b id="d">–</b><small>JOURS</small></div>
    <div class="cell" style="animation-delay:.2s"><b id="h">–</b><small>HEURES</small></div>
    <div class="cell" style="animation-delay:.3s"><b id="m">–</b><small>MIN</small></div>
    <div class="cell" style="animation-delay:.4s"><b id="s">–</b><small>SEC</small></div>
  </div>
  <a class="cta" href="#">🎟 RÉSERVER MA PLACE</a>
</div>
<script>
const sky=document.getElementById('sky');
for(let i=0;i<40;i++){const st=document.createElement('span');st.className='star';
st.style.left=Math.random()*100+'%';st.style.top=Math.random()*70+'%';st.style.animationDelay=(Math.random()*3)+'s';sky.appendChild(st)}
const cols=['#ffd77a','#ff6b9d','#7ab8ff','#9dff8a','#c88aff'];
for(let f=0;f<5;f++){
  const x=10+Math.random()*80, y=16+Math.random()*30, c=cols[f%cols.length], delay=(f*0.55)+'s';
  const r=document.createElement('span');r.className='rocket';r.style.left=x+'%';r.style.animationDelay=(f*0.55-1.46)+'s';sky.appendChild(r);
  const fw=document.createElement('span');fw.className='fw';fw.style.left=x+'%';fw.style.top=y+'%';
  for(let k=0;k<16;k++){const i=document.createElement('i');const a=k/16*2*Math.PI;const rr=36+Math.random()*34;
  i.style.setProperty('--x',Math.cos(a)*rr+'px');i.style.setProperty('--y',Math.sin(a)*rr+'px');
  i.style.setProperty('--c',c);i.style.setProperty('--d',delay);fw.appendChild(i)}
  sky.appendChild(fw);
}
const T=new Date('2027-01-01T00:00:00').getTime();
setInterval(()=>{let dt=Math.max(0,T-Date.now())/1000;
document.getElementById('d').textContent=Math.floor(dt/86400);
document.getElementById('h').textContent=String(Math.floor(dt%86400/3600)).padStart(2,'0');
document.getElementById('m').textContent=String(Math.floor(dt%3600/60)).padStart(2,'0');
document.getElementById('s').textContent=String(Math.floor(dt%60)).padStart(2,'0');},250);
</script>
</body></html>
