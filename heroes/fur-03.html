<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAISON FOURRURE — Hiver 26</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#17100a;min-height:100vh;font-family:Inter,sans-serif;color:#efe3d2;display:flex;align-items:center;justify-content:center;padding:3vmin}
.frame{position:relative;width:min(96%,1080px);aspect-ratio:16/9.6;background:radial-gradient(90% 110% at 60% 40%,#3c2a1c,#241709 60%,#140c05);border-radius:20px;overflow:hidden;box-shadow:0 38px 86px rgba(0,0,0,.75)}
.model{position:absolute;right:6%;bottom:0;height:98%;z-index:3;animation:mi 1.5s ease both;-webkit-mask-image:radial-gradient(62% 76% at 50% 50%,#000 55%,transparent 84%);mask-image:radial-gradient(62% 76% at 50% 50%,#000 55%,transparent 84%)}
@keyframes mi{from{opacity:0;transform:translateX(50px) scale(1.05)}to{opacity:1;transform:none}}
nav{position:absolute;top:0;left:0;right:0;display:flex;gap:26px;align-items:center;padding:24px 34px;z-index:6;font-size:10px;letter-spacing:.22em;color:#bba888}
nav b{font-family:'Cormorant Garamond';font-size:17px;letter-spacing:.3em;color:#efe3d2;margin-right:auto}
h1{position:absolute;left:5%;top:26%;font-family:'Cormorant Garamond';font-weight:500;font-size:clamp(40px,6.4vw,78px);line-height:1.05;z-index:5;animation:up 1.1s .2s ease both}
h1 em{font-style:italic;color:#d9a85e}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.para{position:absolute;left:5%;top:58%;max-width:300px;font-size:11px;font-weight:300;line-height:1.9;color:#cdbb9e;z-index:5;animation:up 1.1s .4s ease both}
.cta{position:absolute;left:5%;bottom:11%;z-index:6;font-size:10.5px;letter-spacing:.3em;color:#efe3d2;text-decoration:none;border-bottom:1px solid #d9a85e;padding-bottom:7px;transition:.3s;animation:up 1.1s .55s ease both}
.cta:hover{letter-spacing:.42em;color:#d9a85e}
.flake{position:absolute;color:#e8d9c2;opacity:0;animation:snow 7s linear infinite;z-index:4;font-size:11px}
@keyframes snow{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:.8}100%{opacity:0;transform:translateY(420px) rotate(240deg)}}
.num{position:absolute;right:30px;bottom:22px;font-family:'Cormorant Garamond';font-style:italic;font-size:15px;color:#9a8666;z-index:6}
.shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,230,190,.07) 50%,transparent 58%);background-size:260% 100%;animation:sh 6s ease-in-out infinite;z-index:5;pointer-events:none}
@keyframes sh{0%{background-position:130% 0}60%,100%{background-position:-130% 0}}
</style></head><body>
<div class="frame">
<nav><b>MAISON FOURRURE</b><span>COLLECTION</span><span>ATELIER</span><span>RDV PRIVÉ</span></nav>
<img class="model" src="img/f3.jpg" alt="">
<span class="shine"></span>
<h1>L'hiver se porte<br>en <em>douceur</em></h1>
<p class="para">Collection Hiver '26 — fourrures éthiques caramel &amp; miel, coupées main f l'atelier AREEJ. Chaque pièce, une étreinte.</p>
<a class="cta" href="#">DÉCOUVRIR LA COLLECTION</a>
<span class="flake" style="left:12%;animation-delay:0s">❄</span>
<span class="flake" style="left:30%;animation-delay:2.4s">❄</span>
<span class="flake" style="left:48%;animation-delay:1.1s">✦</span>
<span class="flake" style="left:64%;animation-delay:3.6s">❄</span>
<span class="flake" style="left:82%;animation-delay:5s">✦</span>
<span class="num">№ 26 / Hiver</span>
</div></body></html>
