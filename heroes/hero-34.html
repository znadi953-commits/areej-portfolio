<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAISON NOIR — BY AREEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
.byareej{position:fixed;bottom:14px;right:16px;z-index:99;font:600 11px Poppins,sans-serif;letter-spacing:2px;color:#1b1b1b;opacity:.75}

body{background:#f5f0e8;font-family:Poppins,sans-serif;position:relative}
.ghost{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:900 24vw Playfair Display,serif;color:transparent;-webkit-text-stroke:1px #b08d3c33;white-space:nowrap;z-index:0;animation:gh 16s ease-in-out infinite alternate}
@keyframes gh{to{transform:translate(-54%,-50%)}}
nav{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:30px 54px}
.logo{font:700 19px Playfair Display,serif;color:#1b1b1b;letter-spacing:4px}
.menu{display:flex;gap:34px}.menu a{color:#1b1b1b99;text-decoration:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;transition:.3s}.menu a:hover{color:#b08d3c}
.hero{position:relative;z-index:5;height:calc(100% - 100px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-top:-20px}
.rule{width:60px;height:1px;background:#b08d3c;margin-bottom:26px;position:relative}
.rule:after{content:"✦";position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:#b08d3c;font-size:12px;background:#f5f0e8;padding:0 8px}
.eyeb{font-size:11px;letter-spacing:6px;color:#b08d3c;text-transform:uppercase;margin-bottom:18px}
h1{font:700 clamp(58px,8vw,104px)/1.04 Playfair Display,serif;color:#1b1b1b;animation:fadeu 1.1s ease both}
h1 i{display:block;font-weight:700;color:#b08d3c}
@keyframes fadeu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.sub{color:#1b1b1bAA;font-size:16px;margin:24px auto 34px;max-width:480px;line-height:1.8;font-weight:400}
.btns{display:flex;gap:22px;align-items:center}
.bp{background:#1b1b1b;color:#f5f0e8;border:none;padding:16px 42px;font:600 13px Poppins;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.4s}
.bp:hover{background:#b08d3c;letter-spacing:5px}
.bs{background:none;border:none;color:#1b1b1b;font:600 13px Poppins;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-bottom:1px solid #b08d3c;padding-bottom:5px;transition:.3s}
.bs:hover{color:#b08d3c}
.cnum{position:absolute;font:700 13px Playfair Display;color:#b08d3c;letter-spacing:2px}
.n1{bottom:34px;left:54px}.n2{top:120px;right:54px;writing-mode:vertical-rl}
</style></head><body>
<div class="ghost prx" data-d="18" data-t=" translate(-50%,-50%)">NOIR</div>
<nav><div class="logo">MAISON NOIR</div><div class="menu"><a href="#">Collection</a><a href="#">Défilés</a><a href="#">Maison</a></div></nav>
<div class="hero">
<div class="eyeb">Automne – Hiver 2026</div><div class="rule"></div>
<h1>L'élégance est<i>une attitude.</i></h1>
<p class="sub">Haute couture façonnée à la main dans nos ateliers — chaque pièce est numérotée et unique.</p>
<div class="btns"><button class="bp">La collection</button><button class="bs">Prendre rendez-vous</button></div>
</div>
<div class="cnum n1">PARIS — CASABLANCA</div><div class="cnum n2">EST. 1998</div>
<div class="byareej">BY AREEJ ✦</div>
<script>
document.addEventListener("mousemove",function(e){
 var cx=(e.clientX/innerWidth-0.5),cy=(e.clientY/innerHeight-0.5);
 document.querySelectorAll(".prx").forEach(function(el){
  var d=parseFloat(el.dataset.d||10);
  el.style.transform="translate("+(cx*d)+"px,"+(cy*d)+"px)"+(el.dataset.t||"");
 });
});
</script></body></html>
