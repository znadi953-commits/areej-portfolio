<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELVET DROP — Poster Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box} 
body{min-height:100vh;background:#140b22;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92;animation:zoom 14s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.grunge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;pointer-events:none;mix-blend-mode:screen}
.grunge span{font-family:'Archivo Black',sans-serif;font-size:clamp(70px,17vw,230px);line-height:.88;color:rgba(255,255,255,.85);letter-spacing:-.02em;filter:blur(.4px);text-shadow:0 0 40px rgba(255,255,255,.25);animation:fadeUp 1.2s ease both}
.grunge span:nth-child(2){animation-delay:.25s;color:rgba(255,255,255,.55)}
@keyframes fadeUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.side{position:absolute;left:26px;top:50%;transform:translateY(-50%) ;z-index:3;font-size:11px;letter-spacing:.12em;line-height:1.8;max-width:210px;color:#cfc4e6;text-transform:uppercase;animation:fadeUp 1s .5s ease both}
.brand{position:absolute;top:26px;right:30px;z-index:3;text-align:right;font-family:'Archivo Black';letter-spacing:.06em;animation:fadeUp 1s .35s ease both}
.brand em{display:block;font-style:normal;font-size:12px;color:#b9a8e0;letter-spacing:.3em;margin-top:6px}
.badge{position:absolute;bottom:30px;right:30px;z-index:3;background:#fff;color:#140b22;font-weight:700;padding:12px 26px;border-radius:999px;text-decoration:none;transition:.3s;animation:fadeUp 1s .65s ease both}
.badge:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.14;background-image:radial-gradient(rgba(255,255,255,.6) .5px,transparent .6px);background-size:3px 3px;mix-blend-mode:overlay}
</style></head><body>
<section class="hero">
<img class="bg" src="img/h1.jpg" alt="">
<div class="grunge"><span>VELVET</span><span>DROP</span></div>
<div class="side">AREEJ × STUDIO — Collection capsule hiver. Doudoune lavande édition limitée, design poster inspiré du streetwear. Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.</div>
<div class="brand">AREEJ<em>× STUDIO</em></div>
<a class="badge" href="#">Découvrir ↗</a>
<div class="grain"></div>
</section></body></html>
