<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREAK BUTIK — New Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#141414;font-family:Inter,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:4vmin}
.page{position:relative;background:#fff;color:#111;width:100%;max-width:1150px;aspect-ratio:10/7;border-radius:6px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6)}
nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:22px;justify-content:center;padding:20px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#777;z-index:5}
nav b{font-family:Archivo;font-weight:800;font-size:15px;color:#111;letter-spacing:.06em;margin:0 18px}
nav span:hover{color:#111;cursor:pointer}
.icons{position:absolute;right:20px;top:18px;font-size:12px;color:#444;z-index:6}
.model{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:88%;z-index:2;animation:in 1.1s ease both}
@keyframes in{from{opacity:0;transform:translateX(-50%) translateY(30px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.nc{position:absolute;left:7%;top:33%;z-index:4;max-width:220px}
.nc h2{font-weight:400;font-size:22px;margin-bottom:12px}
.nc p{font-size:10.5px;line-height:1.7;color:#888}
.cat{position:absolute;right:26%;top:38%;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#555;z-index:4;text-align:center;cursor:pointer}
.cat:hover{color:#000}
.thumbs{position:absolute;right:6%;top:30%;display:flex;flex-direction:column;gap:10px;z-index:4}
.thumbs img{width:62px;height:62px;object-fit:cover;cursor:pointer;transition:.3s;border:1px solid #eee}
.thumbs img:hover{transform:scale(1.12)}
</style></head><body>
<div class="page">
<nav><span>homme</span><span>femme</span><span>divers</span><b>FREAK&nbsp;BUTIK</b><span>collections</span><span>bases</span><span>accessoires</span></nav>
<div class="icons">🔍 🛍 ♡</div>
<div class="nc"><h2>new collection</h2><p>des pièces nées malgré les limites — matières, temps, fait main et circonstances étranges.</p></div>
<div class="cat">catalogue<br>▼</div>
<img class="model" src="img/h6.jpg" alt="">
<div class="thumbs"><img src="img/h6.jpg" style="object-position:50% 12%"><img src="img/h6.jpg" style="object-position:50% 40%"><img src="img/h6.jpg" style="object-position:50% 70%"></div>
</div></body></html>
