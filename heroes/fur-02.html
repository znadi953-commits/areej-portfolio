<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teddy &amp; Co — Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#cbb49a;min-height:100vh;font-family:Inter,sans-serif;color:#4e3a28;display:flex;align-items:center;justify-content:center;padding:3vmin}
.frame{position:relative;width:min(96%,1080px);aspect-ratio:16/9.8;background:linear-gradient(140deg,#f6eddd,#efe2cc 60%,#e5d1b6);border-radius:26px;overflow:hidden;box-shadow:0 34px 76px rgba(90,60,30,.4)}
nav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:22px;padding:22px 30px;z-index:6;font-size:11.5px;font-weight:600;color:#8a6f52}
nav .lg{font-family:Quicksand;font-weight:700;font-size:15px;color:#4e3a28}
nav a{color:inherit;text-decoration:none;transition:.25s}
nav a:hover{color:#4e3a28}
nav .cart{margin-left:auto;background:#4e3a28;color:#f6eddd;border-radius:18px;padding:8px 16px;font-size:10.5px}
.teddy{position:absolute;right:2%;bottom:0;height:88%;z-index:4;filter:drop-shadow(0 24px 30px rgba(80,50,20,.35));animation:sway 5s ease-in-out infinite;transform-origin:bottom center;-webkit-mask-image:radial-gradient(60% 72% at 50% 55%,#000 55%,transparent 82%);mask-image:radial-gradient(60% 72% at 50% 55%,#000 55%,transparent 82%)}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.lead{position:absolute;left:5%;top:22%;max-width:44%;z-index:5}
h1{font-family:Quicksand;font-weight:700;font-size:clamp(34px,5vw,60px);line-height:1.1;animation:up 1s .1s ease both}
h1 em{font-style:normal;color:#c28445}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.lead p{font-size:12px;line-height:1.8;color:#7c6246;margin-top:14px;animation:up 1s .3s ease both}
.row{display:flex;gap:14px;align-items:center;margin-top:24px;animation:up 1s .5s ease both}
.buy{background:#4e3a28;color:#f6eddd;font-size:12px;font-weight:700;padding:14px 28px;border-radius:26px;text-decoration:none;transition:.3s;animation:pu 2.4s infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 rgba(78,58,40,.4)}50%{box-shadow:0 0 0 10px rgba(78,58,40,0)}}
.buy:hover{transform:translateY(-3px)}
.pr{font-family:Quicksand;font-weight:700;font-size:22px}
.pr small{font-size:12px;color:#ab8c67;text-decoration:line-through;margin-left:8px}
.badges{position:absolute;left:5%;bottom:10%;display:flex;gap:10px;z-index:5}
.bd{background:rgba(255,255,255,.75);border-radius:16px;padding:10px 16px;font-size:9.5px;font-weight:600;color:#7c6246;animation:up 1s .65s ease both;transition:.3s}
.bd:hover{transform:translateY(-4px)}
.hearts{position:absolute;font-size:16px;z-index:6;animation:hf 4.5s ease-in-out infinite;opacity:.85}
@keyframes hf{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
</style></head><body>
<div class="frame">
<nav><span class="lg">🧸 Teddy &amp; Co</span><a href="#">Boutique</a><a href="#">Collections</a><a href="#">Cadeaux</a><span class="cart">🛒 Panier (2)</span></nav>
<img class="teddy" src="img/f2.jpg" alt="">
<div class="lead">
  <h1>Le câlin<br><em>parfait</em> existe.</h1>
  <p>Teddy artisanal en peluche caramel ultra-douce. Cousu main, hypoallergénique, w kay-bqa m3ak l3omr kolo. 🤎</p>
  <div class="row"><a class="buy" href="#">Adopter Teddy</a><span class="pr">349 MAD <small>449</small></span></div>
</div>
<div class="badges"><span class="bd">🚚 Livraison 48h</span><span class="bd">🎀 Emballage cadeau</span><span class="bd">⭐ 4.9/5 — 2.3k avis</span></div>
<span class="hearts" style="left:46%;top:24%">🤎</span>
<span class="hearts" style="left:56%;top:60%;animation-delay:1.6s">🧡</span>
</div></body></html>
