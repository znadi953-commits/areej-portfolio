<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOFT — Fluffy Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#b5a3d6;min-height:100vh;font-family:Quicksand,sans-serif;color:#4a3e66;display:flex;align-items:center;justify-content:center;padding:3vmin;overflow:hidden}
.frame{position:relative;width:min(94%,1000px);aspect-ratio:16/10;background:radial-gradient(100% 100% at 50% 30%,#d4c9ee,#c3b4e4 60%,#ad92c6);border-radius:30px;overflow:hidden;box-shadow:0 36px 80px rgba(80,60,130,.45)}
.soft{position:absolute;left:50%;top:46%;width:78%;transform:translate(-50%,-50%);animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 26px 34px rgba(90,60,140,.35));-webkit-mask-image:radial-gradient(62% 62% at 50% 50%,#000 52%,transparent 80%);mask-image:radial-gradient(62% 62% at 50% 50%,#000 52%,transparent 80%)}
@keyframes fl{0%,100%{transform:translate(-50%,-50%) rotate(-1deg)}50%{transform:translate(-50%,-54%) rotate(1deg)}}
.pom{position:absolute;border-radius:50%;filter:blur(.5px);animation:bb 6s ease-in-out infinite}
.p1{left:9%;top:14%;width:48px;height:48px;background:radial-gradient(circle at 34% 30%,#ffe3f0,#f6b5d4)}
.p2{right:8%;top:20%;width:34px;height:34px;background:radial-gradient(circle at 34% 30%,#fff,#dcd0f4);animation-delay:1.2s}
.p3{left:16%;bottom:16%;width:30px;height:30px;background:radial-gradient(circle at 34% 30%,#ffe9c9,#f4cf9a);animation-delay:2s}
.p4{right:14%;bottom:12%;width:52px;height:52px;background:radial-gradient(circle at 34% 30%,#ffd9e8,#eaa6c6);animation-delay:.6s}
@keyframes bb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.08)}}
.cap{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.5em;color:#7a68a5}
.sub{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:12.5px;font-weight:500;color:#6c5c97;text-align:center;line-height:1.8}
.sub b{font-size:14px}
.btn{position:absolute;left:50%;bottom:-1%;transform:translate(-50%,-50%);background:#fff;color:#8a6fb5;font-weight:700;font-size:11px;padding:11px 26px;border-radius:24px;text-decoration:none;box-shadow:0 12px 26px rgba(90,60,140,.3);transition:.3s;animation:pu 2.6s infinite}
@keyframes pu{0%,100%{box-shadow:0 12px 26px rgba(90,60,140,.3)}50%{box-shadow:0 12px 26px rgba(90,60,140,.3),0 0 0 10px rgba(255,255,255,0)}}
.btn:hover{transform:translate(-50%,-56%) scale(1.07)}
</style></head><body>
<div class="frame">
  <div class="cap">A R E E J &nbsp;·&nbsp; T E X T U R E &nbsp;S E R I E S</div>
  <img class="soft" src="img/f1.jpg" alt="">
  <span class="pom p1"></span><span class="pom p2"></span><span class="pom p3"></span><span class="pom p4"></span>
  <div class="sub"><b>Touch the softness.</b><br>Poster 3D fluffy — typographie en fourrure rose</div>
</div></body></html>
