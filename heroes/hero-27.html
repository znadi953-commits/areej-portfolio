<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYSPA — BY AREEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
.byareej{position:fixed;bottom:14px;right:16px;z-index:99;font:600 11px Poppins,sans-serif;letter-spacing:2px;color:#dffcf4;opacity:.75}

body{background:#06251f;font-family:Poppins,sans-serif;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75;z-index:0}
.b1{width:46vw;height:46vw;background:#0fae8d;top:-12%;left:-8%;animation:dr1 14s ease-in-out infinite alternate}
.b2{width:40vw;height:40vw;background:#2a7de0;bottom:-14%;right:-6%;animation:dr2 17s ease-in-out infinite alternate}
.b3{width:26vw;height:26vw;background:#8be8c8;top:30%;left:55%;animation:dr3 11s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate(9vw,7vh) scale(1.15)}}
@keyframes dr2{to{transform:translate(-8vw,-9vh) scale(.9)}}
@keyframes dr3{to{transform:translate(-6vw,8vh) scale(1.2)}}
nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:26px 48px}
.logo{font:800 20px Space Grotesk,sans-serif;color:#fff;letter-spacing:1px}
.menu{display:flex;gap:30px}.menu a{color:rgba(255,255,255,.75);text-decoration:none;font-size:14px;transition:.3s}.menu a:hover{color:#fff}
.ncta{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);color:#fff;padding:10px 22px;border-radius:40px;font-size:13px;font-weight:600;cursor:pointer;transition:.3s}.ncta:hover{background:rgba(255,255,255,.3)}
.hero{position:relative;z-index:5;height:calc(100% - 92px);display:flex;align-items:center;justify-content:center}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);border-radius:28px;padding:54px 64px;text-align:center;max-width:760px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:up .9s ease both}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.eyeb{display:inline-block;font-size:12px;letter-spacing:3px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:7px 18px;border-radius:30px;margin-bottom:22px}
h1{font:800 64px/1.08 Space Grotesk,sans-serif;color:#fff}
h1 .grad{background:linear-gradient(90deg,#8be8c8,#bdf0ff,#8be8c8);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3.5s linear infinite}
@keyframes sh{to{background-position:200% center}}
.sub{color:rgba(255,255,255,.8);font-size:17px;margin:20px auto 30px;max-width:520px;line-height:1.6}
.btns{display:flex;gap:16px;justify-content:center}
.bp{background:linear-gradient(90deg,#8be8c8,#bdf0ff);color:#08101e;font-weight:700;border:none;padding:15px 34px;border-radius:40px;font-size:15px;cursor:pointer;transition:.3s;box-shadow:0 10px 30px #8be8c855}.bp:hover{transform:translateY(-3px)}
.bs{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:15px 34px;border-radius:40px;font-size:15px;cursor:pointer;transition:.3s}.bs:hover{background:rgba(255,255,255,.12)}
.stats{display:flex;gap:40px;justify-content:center;margin-top:34px}
.st b{display:block;font:700 22px Space Grotesk;color:#fff}.st span{font-size:12px;color:rgba(255,255,255,.6)}
</style></head><body>
<div class="blob b1 prx" data-d="30"></div><div class="blob b2 prx" data-d="22"></div><div class="blob b3 prx" data-d="40"></div>
<nav><div class="logo">SKYSPA</div><div class="menu"><a href="#">Rituels</a><a href="#">Massages</a><a href="#">Offres</a></div><button class="ncta">Réserver</button></nav>
<div class="hero"><div class="card">
<span class="eyeb">❀ BIEN-ÊTRE URBAIN</span>
<h1>Respirez.<br><span class="grad">Vous êtes arrivé.</span></h1>
<p class="sub">Spa panoramique au 32ᵉ étage — hammam, soins signature et piscine à ciel ouvert au-dessus de la ville.</p>
<div class="btns"><button class="bp">Réserver un rituel</button><button class="bs">Carte cadeau</button></div>
<div class="stats"><div class="st"><b>32ᵉ</b><span>Étage</span></div><div class="st"><b>17</b><span>Soins signature</span></div><div class="st"><b>5★</b><span>Expérience</span></div></div>
</div></div>
<div class="byareej">BY AREEJ ✦</div>
<script>
document.addEventListener("mousemove",function(e){
 var cx=(e.clientX/innerWidth-0.5),cy=(e.clientY/innerHeight-0.5);
 document.querySelectorAll(".prx").forEach(function(el){
  var d=parseFloat(el.dataset.d||10);
  el.style.transform="translate("+(cx*d)+"px,"+(cy*d)+"px)"+(el.dataset.t||"");
 });
});
</script></body></html>
