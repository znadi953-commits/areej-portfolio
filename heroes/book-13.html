<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Katana Spirit</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#4a3a30;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#f5ead8,#ecd9c0 55%,#dfc3a4)}
.pt{position:fixed;top:-5vh;animation:fall linear infinite;pointer-events:none;opacity:.8}
@keyframes fall{to{transform:translateY(112vh) rotate(220deg)}}
h1{font-family:'Shippori Mincho',serif;font-size:34px;color:#8e2430;letter-spacing:6px;margin-bottom:14px;position:relative;z-index:5}
.cover{background:url('img/b13.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#6e1a24,#30080d);border:2px solid #c99}
.pg{background:#fbf5ea;color:#4a3a30;padding:24px 22px;display:flex;flex-direction:column;font-family:'Shippori Mincho',serif}
.pg h2{font-size:21px;color:#8e2430;text-align:center;letter-spacing:4px;margin-bottom:12px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,rgba(142,36,48,.22) 30px 31px);border-radius:4px}
.wave{height:16px;border-radius:8px;margin-top:10px;background:repeating-linear-gradient(90deg,#2a5d8a 0 16px,#8fb8d8 16px 32px);opacity:.6}
.elems{display:flex;justify-content:space-around;margin:14px 0}
.el{width:52px;height:52px;border-radius:50%;border:2.5px solid;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.quote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fbf5ea;text-align:center;padding:30px;font-family:'Shippori Mincho',serif}
.qjp{font-size:40px;letter-spacing:8px;color:#8e2430;writing-mode:vertical-rl}
.inback{background:linear-gradient(140deg,#5e141e,#26050a);display:flex;align-items:center;justify-content:center}
.seal{width:90px;height:90px;border-radius:14px;background:#c22a38;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-family:'Shippori Mincho',serif;box-shadow:0 0 24px rgba(220,60,70,.5)}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<h1>刀 KATANA SPIRIT 魂</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>ノート · Notes 🌸</h2><div class="lin"></div><div class="wave"></div></div></div>
<div class="sheet"><div class="face front quote"><div class="qjp">心を燃やせ</div>
 <div style="font-size:16px;color:#7a5a46">« Enflamme ton cœur » 🔥</div></div>
 <div class="face back pg"><h2>Les Éléments</h2>
 <div class="elems"><span class="el" style="border-color:#2a5d8a;color:#2a5d8a">水</span><span class="el" style="border-color:#c2512a;color:#c2512a">炎</span><span class="el" style="border-color:#c2a52a;color:#a8862a">雷</span></div>
 <div class="elems"><span class="el" style="border-color:#3f8a52;color:#3f8a52">風</span><span class="el" style="border-color:#7a6a5a;color:#7a6a5a">岩</span><span class="el" style="border-color:#8e2430;color:#8e2430">魂</span></div>
 <div class="lin"></div></div></div>
<div class="sheet"><div class="face front pg"><h2>和紙 · Washi 🦊</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:22px">🌊 🌸 🗡️</div></div>
 <div class="face back inback"><div class="seal">魂</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();

for(let i=0;i<12;i++){const s=document.createElement('span');s.className='pt';s.textContent=['🌸','🌸','💮'][i%3];s.style.left=Math.random()*100+'vw';s.style.fontSize=(12+Math.random()*14)+'px';s.style.animationDuration=(8+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';document.body.appendChild(s);}
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
