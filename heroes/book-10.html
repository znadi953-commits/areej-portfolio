<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Planner Retro</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;color:#fff6ec;overflow:hidden;padding:40px 0;background:#14100d}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 2.2px,transparent 3px);background-size:26px 26px;pointer-events:none}
.ht{position:fixed;animation:fl ease-in-out infinite alternate;pointer-events:none;opacity:.7}
@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-26px)}}
h1{font-family:'Dancing Script',cursive;font-size:44px;color:#e8303a;text-shadow:0 0 18px rgba(230,50,60,.6);margin-bottom:14px;z-index:5;position:relative}
.cover{background:url('img/b10.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#6e1014,#2b0507);border:2px solid #e8737a}
.pg{background:#fdf6e9;color:#5a1e22;padding:20px 18px;display:flex;flex-direction:column}
.pg h2{font-family:'Dancing Script',cursive;font-size:30px;color:#c21e28;text-align:center;margin-bottom:8px}
.wkh{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.wkh span{background:#1c1512;color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:5px 0;border-radius:4px}
.mini7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;flex:1}
.mini7 span{background:#fff;border:1.5px solid #e8c9b0;border-radius:4px;min-height:40px;position:relative}
.mini7 span::after{content:'♥';position:absolute;right:3px;top:1px;font-size:7px;color:#e8a0a6}
.box{border:2px solid #c21e28;border-radius:12px;background:#fff;padding:10px 14px;margin:7px 0}
.box h3{font-size:12.5px;letter-spacing:1.5px;color:#c21e28;text-align:center;margin-bottom:5px}
.pr{display:flex;align-items:flex-end;gap:6px;margin:7px 0;font-weight:700;font-size:13px;color:#8a3036}
.pr input{flex:1;border-bottom:2px dotted #d98a90;font-size:13px;color:#5a1e22}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 28px,#ecc9b4 28px 29px);border-radius:4px}
.quote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fdf6e9;font-family:'Dancing Script',cursive;font-size:32px;color:#c21e28;text-align:center;padding:30px}
.inback{background:linear-gradient(140deg,#8e1219,#3c0608);display:flex;align-items:center;justify-content:center;font-size:48px}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="ht" style="top:12%;left:7%;font-size:30px;animation-duration:4s">❤️</span>
<span class="ht" style="top:66%;left:9%;font-size:24px;animation-duration:5s">🌹</span>
<span class="ht" style="top:20%;right:8%;font-size:26px;animation-duration:4.5s">☕</span>
<span class="ht" style="top:72%;right:9%;font-size:26px;animation-duration:5.5s">❤️</span>
<h1>Monthly Planner ❤️</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Month: ______</h2>
 <div class="wkh"><span>SUN ♥</span><span>MON ♥</span><span>TUE ♥</span><span>WED ♥</span><span>THU ♥</span><span>FRI ♥</span><span>SAT ♥</span></div>
 <div class="mini7"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div></div>
<div class="sheet"><div class="face front pg"><h2>Goals &amp; Dates</h2>
 <div class="box"><h3>MONTHLY GOALS ♥</h3><div class="pr">♥<input></div><div class="pr">♥<input></div><div class="pr">♥<input></div><div class="pr">♥<input></div></div>
 <div class="box" style="flex:1"><h3>IMPORTANT DATES ♥</h3><div class="pr">♥<input></div><div class="pr">♥<input></div><div class="pr">♥<input></div><div class="pr">♥<input></div></div></div>
 <div class="face back pg"><h2>Notes</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:13px;letter-spacing:1px;color:#c21e28;font-weight:700">She is STRONG, fearless &amp; LOVED ❤️</div></div></div>
<div class="sheet"><div class="face front quote">☕<br>« Faith · Hope · Love »<br>Coffee &amp; Plans<br>🌹</div>
 <div class="face back inback">💋</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
