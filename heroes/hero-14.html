<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETROLITE — Get The Pug Outta Here</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#000;font-family:Inter,sans-serif;color:#f2f2f2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:4vmin}
.frame{position:relative;width:100%;max-width:1080px;aspect-ratio:16/9.4;background:#0a0f10;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.8);display:grid;grid-template-columns:47% 53%}
.photo{position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 30%;animation:zoom 10s ease-out both}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.brand{position:absolute;left:8%;top:7%;font-family:Archivo;font-weight:700;font-size:13px;letter-spacing:.3em;z-index:4;color:#fff}
.prog{position:absolute;left:8%;bottom:7%;display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.2em;z-index:4;color:#ddd}
.prog .line{width:120px;height:1px;background:rgba(255,255,255,.35);position:relative}
.prog .line::after{content:"";position:absolute;left:0;top:-1px;height:3px;width:40%;background:#e03131;animation:prog 3s ease both}
@keyframes prog{from{width:0}to{width:40%}}
.right{position:relative;background:#0e1314;padding:6% 7%}
nav{display:flex;gap:26px;font-size:9.5px;letter-spacing:.22em;color:#cfcfcf;margin-bottom:16%}
nav a{color:inherit;text-decoration:none;transition:.25s}
nav a:hover{color:#fff}
h1{font-family:Archivo;font-weight:500;font-size:clamp(17px,2vw,26px);letter-spacing:.42em;color:#eee;animation:fadeUp .9s .15s ease both}
.big{font-family:Archivo;font-weight:900;font-size:clamp(54px,7.4vw,96px);letter-spacing:.14em;line-height:1.1;margin:6px 0;animation:fadeUp .9s .3s ease both}
h2.sub{font-family:Archivo;font-weight:500;font-size:clamp(14px,1.7vw,22px);letter-spacing:.5em;color:#ddd;animation:fadeUp .9s .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.side{position:absolute;right:16px;top:34%;display:flex;flex-direction:column;gap:38px;font-size:8.5px;letter-spacing:.3em;color:#9a9a9a;writing-mode:vertical-rl}
.res{position:absolute;right:0;bottom:0;left:22%;display:flex;background:#0a0a0a;border-top:1px solid rgba(255,255,255,.07);animation:fadeUp 1s .6s ease both}
.res .thumb{width:92px;height:92px;flex-shrink:0;background:#fff}
.res .thumb img{width:100%;height:100%;object-fit:cover}
.res .info{padding:14px 18px;flex:1}
.res .info b{font-size:11.5px;display:block}
.res .info em{font-size:9.5px;font-style:normal;color:#e03131;letter-spacing:.06em}
.res .info p{font-size:9.5px;color:#b9b9b9;line-height:1.6;margin-top:6px;max-width:300px}
.res .arrows{width:46px;flex-shrink:0;display:flex;flex-direction:column}
.res .arrows span{flex:1;display:grid;place-items:center;background:#e03131;color:#fff;font-size:11px;cursor:pointer;transition:.25s}
.res .arrows span:last-child{background:#b02020}
.res .arrows span:hover{filter:brightness(1.2)}
</style></head><body>
<div class="frame">
  <div class="photo"><img src="img/h14.jpg" alt=""></div>
  <span class="brand">RETROLITE</span>
  <span class="prog">01 <span class="line"></span> 03</span>
  <div class="right">
    <nav><a href="#">HOME</a><a href="#">OUR STORY</a><a href="#">OUR DOGS</a><a href="#">SERVICES</a><a href="#">CONTACT</a></nav>
    <h1>G E T&nbsp;&nbsp;T H E</h1>
    <div class="big">PUG</div>
    <h2 class="sub">OUTTA&nbsp;HERE</h2>
    <div class="side"><span>FRENCH BULLDOG</span><span>PUG</span></div>
  </div>
  <div class="res">
    <span class="thumb"><img src="img/h14b.jpg" alt=""></span>
    <span class="info"><b>Our Residents</b><em>Meet Humble</em><p>A long eared pug looking for a friendly family with a heart warming home.</p></span>
    <span class="arrows"><span>∧</span><span>∨</span></span>
  </div>
</div></body></html>
