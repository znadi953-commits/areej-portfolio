<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#fff;overflow:hidden;padding:40px 0;background:#140a2e}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(transparent 0 96%,rgba(255,45,200,.35) 96%),linear-gradient(90deg,transparent 0 96%,rgba(45,220,255,.3) 96%);background-size:46px 46px;transform:perspective(400px) rotateX(30deg) scale(1.6);transform-origin:50% 100%;pointer-events:none;opacity:.5}
.fl{position:fixed;animation:bob ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-24px)}}
h1{font-family:'Luckiest Guy',cursive;font-size:36px;background:linear-gradient(#fff,#9adfff 45%,#3a7bd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(3px 3px 0 #e8187e);margin-bottom:16px;position:relative;z-index:5}
.cover{background:url('img/b14.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#2c1450,#0d0620);border:2px solid #e8187e}
.pg{background:#1a0f3a;color:#cfe3ff;padding:24px 22px;display:flex;flex-direction:column}
.pg h2{font-family:'Luckiest Guy',cursive;font-size:22px;color:#ffd21e;-webkit-text-stroke:1px #7a1456;text-align:center;margin-bottom:12px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,rgba(232,24,126,.4) 30px 31px);border-radius:4px}
.robo{background:#f4f8ff;color:#1c2b55}
.robo h2{color:#1565d8;-webkit-text-stroke:0}
.robo .lin{background:repeating-linear-gradient(transparent 0 30px,#c4d6f0 30px 31px)}
.robo::before{content:'';display:block;height:12px;border-radius:6px;margin-bottom:10px;background:repeating-linear-gradient(90deg,#d8282f 0 30px,#1565d8 30px 60px,#fff 60px 70px)}
.comic{background:#fff;color:#111}
.comic h2{color:#111;-webkit-text-stroke:0;font-family:'Luckiest Guy',cursive}
.comic .lin{background:repeating-linear-gradient(transparent 0 30px,#bbb 30px 31px)}
.comic{background-image:radial-gradient(#ddd 1.6px,transparent 2px);background-size:14px 14px;background-color:#fff}
.pow{display:inline-block;background:#ffd21e;border:3px solid #111;border-radius:10px;padding:4px 12px;font-family:'Luckiest Guy',cursive;transform:rotate(-4deg);margin:0 5px}
.quote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#2c1450,#140a2e);text-align:center;padding:30px;font-family:'Luckiest Guy',cursive;font-size:26px;color:#9adfff;text-shadow:0 0 16px rgba(80,180,255,.8)}
.inback{background:linear-gradient(140deg,#3a1264,#120626);display:flex;align-items:center;justify-content:center;font-size:46px}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="fl" style="top:12%;left:6%;font-size:28px;animation-duration:3s">⚡</span>
<span class="fl" style="top:64%;left:8%;font-size:26px;animation-duration:4s">💥</span>
<span class="fl" style="top:18%;right:7%;font-size:28px;animation-duration:3.4s">🤖</span>
<span class="fl" style="top:70%;right:9%;font-size:26px;animation-duration:4.4s">⚡</span>
<h1>HERO ZONE 💥</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>⚡ Morph Notes</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;letter-spacing:2px;color:#e8187e;font-weight:800">IT'S HERO TIME! 90's RADICAL</div></div></div>
<div class="sheet"><div class="face front pg robo"><h2>🤖 Robo Notes</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-weight:800;color:#d8282f">ROBOTS COMBINE! 🔧</div></div>
 <div class="face back pg comic"><h2>🦇 Comic Zone</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:10px"><span class="pow">POW!</span><span class="pow" style="transform:rotate(3deg);background:#e8187e;color:#fff">BAM!</span><span class="pow" style="transform:rotate(-2deg);background:#1565d8;color:#fff">ZAP!</span></div></div></div>
<div class="sheet"><div class="face front quote">🛡️<br>TOGETHER<br>WE ARE MORE!<br>⚡</div>
 <div class="face back inback">🦸⚡</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
