<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Lazy Cat</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#5b3a1e;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#fdf3e0,#f7ddb4 55%,#eec389)}
.pw{position:fixed;animation:fl ease-in-out infinite alternate;pointer-events:none;opacity:.5}
@keyframes fl{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-24px) rotate(6deg)}}
h1{font-family:'Luckiest Guy',cursive;font-size:36px;color:#e8821e;-webkit-text-stroke:1.5px #4a2c10;margin-bottom:16px;z-index:5;position:relative}
.cover{background:url('img/b6.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#593a1c,#2e1c0b);border:2px solid #e8a95c}
.pg{background:#fffaf0;color:#5b3a1e;padding:24px 22px;display:flex;flex-direction:column}
.pg h2{font-family:'Luckiest Guy',cursive;font-size:24px;color:#e8821e;text-align:center;margin-bottom:12px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,#ecd3ad 30px 31px);border-radius:4px}
.tk{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:15px}
.tk input[type=checkbox]{width:17px;height:17px;accent-color:#e8821e}
.tk input[type=text]{flex:1;border-bottom:2px dotted #d9ab6e;font-size:15px;color:#5b3a1e}
.quote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#fcecd2,#f5d6a4);font-size:24px;font-weight:700;color:#8a5a26;text-align:center;padding:30px}
.inback{background:linear-gradient(140deg,#4a2c10,#241404);display:flex;align-items:center;justify-content:center;font-size:52px}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<span class="pw" style="top:12%;left:7%;font-size:30px;animation-duration:4s">🐾</span>
<span class="pw" style="top:64%;left:9%;font-size:26px;animation-duration:5s">☕</span>
<span class="pw" style="top:20%;right:8%;font-size:28px;animation-duration:4.5s">🐾</span>
<span class="pw" style="top:72%;right:10%;font-size:26px;animation-duration:5.5s">🧡</span>
<h1>LAZY CAT 😼</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>Notes 🐾</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:10px;font-size:26px">🥣 MEOW</div></div></div>
<div class="sheet"><div class="face front pg"><h2>À faire… peut-être 😴</h2>
 <div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div><div class="tk"><input type="checkbox"><input type="text" placeholder="demain inchallah..."></div>
 <div style="text-align:center;margin-top:auto;font-size:30px">🐾 🧸 ☕</div></div>
 <div class="face back pg"><h2>Snacks &amp; Sieste 📋</h2><div class="lin"></div></div></div>
<div class="sheet"><div class="face front quote">😼<br>« Je mange,<br>je dors,<br>je règne. »<br>🧡</div>
 <div class="face back inback">😽</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
