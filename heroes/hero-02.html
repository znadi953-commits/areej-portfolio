<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUILD FUTURE — Robot Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#e9e7e3;color:#111;font-family:'Space Grotesk',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;gap:26px;padding:22px 4vw;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#444,#000);margin-right:auto}
nav a{color:#111;text-decoration:none;opacity:.75}nav a:hover{opacity:1}
.pill{border:1.5px solid #111;border-radius:999px;padding:10px 20px;font-weight:600;text-decoration:none;color:#111;transition:.25s}
.pill.black{background:#111;color:#fff}
.pill:hover{transform:translateY(-2px)}
.stage{position:relative;text-align:center;padding-top:10px}
.big{font-family:'Archivo Black';font-size:clamp(70px,16.5vw,250px);line-height:.82;letter-spacing:-.03em;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
.robot{position:relative;margin:-4vw auto 0;width:min(520px,60vw);display:block;z-index:2;animation:rise 1.1s .2s ease both;filter:drop-shadow(0 30px 40px rgba(0,0,0,.25));border-radius:24px}
.chip{position:absolute;z-index:3;background:#f6f4f0;border:1px solid #111;border-radius:999px;padding:8px 18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;animation:float 4s ease-in-out infinite}
.chip.c1{left:16%;top:34%} .chip.c2{left:38%;top:68%;animation-delay:1.2s} .chip.c3{right:15%;top:40%;animation-delay:2.1s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding:0 4vw 34px;gap:20px;flex-wrap:wrap}
.foot .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.foot p{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.tag{border:1px solid #111;border-radius:999px;padding:7px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.card{background:#111;color:#fff;border-radius:16px;padding:14px 18px;font-size:11px;letter-spacing:.08em;max-width:290px;text-transform:uppercase;animation:float 5s ease-in-out infinite}
</style></head><body>
<nav><div class="dot"></div><a href="#">Lab</a><a href="#">Services</a><a href="#">Tech</a><a href="#">Industries</a><a href="#">About</a><a class="pill" href="#">Request a demo</a><a class="pill black" href="#">Build with us</a></nav>
<div class="stage">
<div class="big">BUILD<br>FUTURE</div>
<span class="chip c1">Predict</span><span class="chip c2">Prototype</span><span class="chip c3">Propel</span>
<img class="robot" src="img/h2.jpg" alt="robot">
</div>
<div class="foot">
<div><p>We don't imagine futures — we architect them</p>
<div class="tags"><span class="tag">AI-first design</span><span class="tag">Ethical scaling</span><span class="tag">Cognitive development</span></div></div>
<div class="card">👋 Hi, I'm AREEJ — chief future architect. Let's engineer your next decade!</div>
</div></body></html>
