<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Diary — xoxo</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'VT323',monospace;color:#ffb3e6;background:#070008;overflow:hidden;padding:40px 0}
.star{position:fixed;color:#ff9ae0;animation:tw ease-in-out infinite alternate;pointer-events:none}
@keyframes tw{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
.frame{position:fixed;inset:10px;border:3px dashed #d14fd1;border-radius:8px;pointer-events:none;box-shadow:0 0 22px rgba(255,80,200,.25) inset}
h1{font-size:40px;letter-spacing:4px;color:#ff8ad8;text-shadow:0 0 14px #ff4fc3;margin-bottom:6px;z-index:5}
.wel{font-size:20px;color:#c69aff;margin-bottom:20px;z-index:5}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:560px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.book.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.book.open.shake{animation:none}
.hint{margin-top:26px;text-align:center;font-size:14px;letter-spacing:.5px;opacity:.85}
.closebtn{margin-top:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;backdrop-filter:blur(4px)}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}

.book{width:360px;height:560px}
.book.open{transform:translateX(180px)}
.cover{background:url('img/b2.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#5c1060,#2a0433);border:2px solid #d14fd1}
.pg{background:linear-gradient(160deg,#ffd9f1,#ffc0e9);color:#8a1c6b;padding:26px 22px;display:flex;flex-direction:column;font-size:21px}
.pg h2{font-size:28px;text-align:center;color:#d6189a;text-shadow:1px 1px 0 #fff;margin-bottom:14px;letter-spacing:2px}
.pxbox{border:3px dotted #e05ab4;border-radius:4px;background:rgba(255,255,255,.55);padding:14px;flex:1;display:flex;flex-direction:column}
.fld{display:flex;align-items:flex-end;gap:8px;margin:12px 0}
.fld input{flex:1;border-bottom:2px dotted #d6189a;font-size:20px;font-family:inherit;color:#8a1c6b}
textarea{flex:1;width:100%;resize:none;font-size:20px;color:#8a1c6b;background:repeating-linear-gradient(transparent 0 30px,rgba(214,24,154,.25) 30px 31px);line-height:31px}
.bubble{margin-top:12px;border:2px solid #a44fd1;border-radius:8px;padding:10px;text-align:center;color:#7b2fa0;background:rgba(255,255,255,.5)}
.inback{background:linear-gradient(140deg,#4d0a55,#22032b);display:flex;align-items:center;justify-content:center;font-size:42px;color:#ff8ad8;text-shadow:0 0 18px #ff4fc3}
.lock{position:absolute;right:-16px;top:52%;z-index:500;width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 32% 28%,#ffd1ec,#ff5fb8 60%,#d6189a);box-shadow:0 0 22px rgba(255,80,190,.8),inset 0 -4px 10px rgba(150,0,90,.5);font-size:30px;transition:transform .4s,opacity .5s}
.lock:hover{transform:scale(1.1)}
.lock.off{transform:scale(1.6) rotate(25deg);opacity:0;pointer-events:none}
.lockmsg{position:absolute;right:-30px;top:65%;z-index:500;font-size:17px;color:#ffb3e6;width:120px;text-align:center;transition:opacity .5s}
</style></head><body>
<div class="frame"></div>
<h1>♡ My Diary ♡</h1><div class="wel">Welcome to my world ✦</div>
<div class="scene"><div class="book" id="book">
 <div class="backboard"></div>
 <button class="lock" id="lock">🔒</button><div class="lockmsg" id="lockmsg">klik 3la l 9fel 💗</div>
 <div class="sheet"><div class="face front cover"></div>
  <div class="face back pg"><h2>♡ About Me ♡</h2><div class="pxbox">
   <div class="fld">✦ Name: <input type="text"></div>
   <div class="fld">✦ Age: <input type="text"></div>
   <div class="fld">✦ Mood: <input type="text" placeholder="happy ^-^"></div>
   <div class="fld">✦ Fav color: <input type="text" placeholder="pink!!"></div>
   <div style="text-align:center;margin-top:auto;font-size:34px">🎀</div></div></div></div>
 <div class="sheet"><div class="face front pg"><h2>✎ My Thoughts</h2><div class="pxbox"><textarea placeholder="dear diary..."></textarea></div></div>
  <div class="face back pg"><h2>♡ Friends ♡</h2><div class="pxbox">
   <div class="fld">💗 <input type="text"></div><div class="fld">💜 <input type="text"></div>
   <div class="fld">💙 <input type="text"></div><div class="fld">💖 <input type="text"></div>
   <div style="text-align:center;margin-top:auto;font-size:30px">⋆｡˚ ☁︎ ˚｡⋆</div></div></div></div>
 <div class="sheet"><div class="face front pg"><h2>★ Guestbook ★</h2><div class="pxbox"><textarea placeholder="please sign my guestbook!"></textarea></div>
   <div class="bubble">Thanks for visiting! xoxo 💌</div></div>
  <div class="face back inback">x o x o 💗</div></div>
</div></div>
<div class="hint" style="color:#c69aff">🔒 L book msdod b l 9fel — 7ello 3ad t9der t9elleb!</div>
<button class="closebtn" id="seddBtn" style="border-color:#d14fd1;color:#ffb3e6">↺ Sedd my diary</button>
<script>
window.LOCKED_INIT=true;

const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
let locked = window.LOCKED_INIT||false;
function upd(){
  const n=sheets.filter(s=>s.classList.contains('flipped')).length;
  book.classList.toggle('open', n>0);
  sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')? 10+i : 100+sheets.length-i;});
}
sheets.forEach(s=>{s.addEventListener('click',e=>{
  if(e.target.closest('input,textarea,.noflip'))return;
  if(locked){book.classList.add('shake');setTimeout(()=>book.classList.remove('shake'),500);return;}
  const i=sheets.indexOf(s);
  if(!s.classList.contains('flipped')){ if(i>0&&!sheets[i-1].classList.contains('flipped'))return; }
  else { if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return; }
  s.classList.toggle('flipped');upd();
});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
window.unlockBook=function(){locked=false;};

const lk=document.getElementById('lock'),lm=document.getElementById('lockmsg');
lk.addEventListener('click',e=>{e.stopPropagation();lk.textContent='🔓';setTimeout(()=>{lk.classList.add('off');lm.style.opacity=0;unlockBook();},350);});
for(let i=0;i<40;i++){const s=document.createElement('span');s.className='star';s.textContent=['✦','✧','⋆','♡','★'][i%5];s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.fontSize=(9+Math.random()*16)+'px';s.style.animationDuration=(1.2+Math.random()*2.5)+'s';s.style.animationDelay=(-Math.random()*3)+'s';document.body.appendChild(s);}
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
