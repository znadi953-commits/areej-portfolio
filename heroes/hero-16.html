<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOKYO DRIFT — Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#cfc8b8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3vmin;font-family:'Space Mono',monospace}
.frame{position:relative;width:100%;max-width:1120px;aspect-ratio:16/9.8;overflow:hidden;box-shadow:0 34px 80px rgba(40,30,10,.5);background:
 repeating-linear-gradient(0deg,rgba(60,50,30,.05) 0 1px,transparent 1px 7px),
 repeating-linear-gradient(90deg,rgba(60,50,30,.045) 0 1px,transparent 1px 110px),
 linear-gradient(140deg,#ece6d6,#e4ddc9 55%,#d9d1bc)}
.mq{position:absolute;left:0;right:0;overflow:hidden;white-space:nowrap;z-index:2}
.mq span{display:inline-block;font-family:'Archivo Black';line-height:.9;letter-spacing:-.01em}
.mq.top{top:-2%}
.mq.top span{font-size:clamp(70px,12vw,150px);color:#17150f;animation:sl 22s linear infinite}
.mq.bot{bottom:-3%}
.mq.bot span{font-size:clamp(70px,12vw,150px);color:#e0457b;animation:sr 22s linear infinite;-webkit-text-stroke:2px #c22f63}
@keyframes sl{to{transform:translateX(-50%)}}
@keyframes sr{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.car{position:absolute;left:50%;top:51%;width:74%;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 24px 30px rgba(40,20,10,.45)) saturate(1.08);-webkit-mask-image:radial-gradient(68% 68% at 50% 50%,#000 55%,transparent 82%);mask-image:radial-gradient(68% 68% at 50% 50%,#000 55%,transparent 82%);animation:slide 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{opacity:0;transform:translate(30%,-50%)}to{opacity:1;transform:translate(-50%,-50%)}}
.flare{position:absolute;left:44%;top:44%;width:120px;height:120px;z-index:5;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,160,200,.5) 28%,transparent 65%);animation:fl 2.6s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.jp{position:absolute;writing-mode:vertical-rl;font-size:10px;letter-spacing:.4em;color:#6b6350;z-index:6}
.j1{left:16px;top:12%}.j2{right:16px;bottom:12%}
.stamp{position:absolute;left:3%;bottom:6%;z-index:6;font-size:9px;letter-spacing:.2em;color:#4c4433;line-height:1.9;background:rgba(236,230,214,.8);padding:8px 12px;border:1px solid rgba(60,50,30,.25);transform:rotate(-2deg)}
.chip{position:absolute;right:3%;top:7%;z-index:6;background:#17150f;color:#ece6d6;font-size:9.5px;letter-spacing:.3em;padding:9px 16px;transform:rotate(2deg);animation:fl 3.4s ease-in-out infinite}
</style></head><body>
<div class="frame">
  <div class="mq top"><span>TOKYO DRIFT — TOKYO DRIFT — TOKYO DRIFT — TOKYO DRIFT —&nbsp;</span></div>
  <div class="mq bot"><span>TOKYO DRIFT — TOKYO DRIFT — TOKYO DRIFT — TOKYO DRIFT —&nbsp;</span></div>
  <span class="jp j1">東京ドリフト・真夜中</span><span class="jp j2">走り屋スタイル</span>
  <img class="car" src="img/h16.jpg" alt=""><span class="flare"></span>
  <div class="stamp">MIDNIGHT RUN — KN 0837<br>AREEJ POSTER SERIES '26</div>
  <span class="chip">JDM ✦ CHROME</span>
</div></body></html>
