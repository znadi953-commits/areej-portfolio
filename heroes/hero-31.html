<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON_RUN// — BY AREEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
.byareej{position:fixed;bottom:14px;right:16px;z-index:99;font:600 11px Poppins,sans-serif;letter-spacing:2px;color:#8af7ff;opacity:.75}

body{background:#05060f;font-family:Space Grotesk,sans-serif;position:relative}
.floor{position:absolute;bottom:0;left:-50%;right:-50%;height:52%;background:
 repeating-linear-gradient(90deg,#19e6ff33 0 2px,transparent 2px 80px),
 repeating-linear-gradient(0deg,#19e6ff33 0 2px,transparent 2px 80px);
 transform:perspective(420px) rotateX(63deg);transform-origin:top;animation:fl 3.2s linear infinite}
@keyframes fl{to{background-position:0 80px,0 80px}}
.glow{position:absolute;bottom:38%;left:50%;transform:translateX(-50%);width:70vw;height:200px;background:radial-gradient(ellipse,#ff3cf044,transparent 70%);filter:blur(30px)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);pointer-events:none;z-index:50}
nav{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:24px 46px}
.logo{font:700 20px JetBrains Mono,monospace;color:#19e6ff;text-shadow:0 0 12px #19e6ff}
.menu{display:flex;gap:28px}.menu a{color:#9aa4c8;font:400 13px JetBrains Mono;text-decoration:none;transition:.3s}.menu a:hover{color:#19e6ff;text-shadow:0 0 10px #19e6ff}
.hero{position:relative;z-index:5;height:calc(100% - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-top:-30px}
.tagc{font:400 13px JetBrains Mono;color:#ff3cf0;border:1px solid #ff3cf066;padding:7px 18px;border-radius:4px;margin-bottom:24px;letter-spacing:3px;animation:bl 2.4s steps(2) infinite}
@keyframes bl{50%{opacity:.5}}
h1{font:700 clamp(58px,8.6vw,110px)/1 Space Grotesk;color:#fff;text-transform:uppercase;letter-spacing:4px}
h1 b{color:#19e6ff;text-shadow:0 0 18px #19e6ff,0 0 60px #19e6ff;animation:fk 4s infinite}
@keyframes fk{0%,92%,96%,100%{opacity:1}94%,98%{opacity:.35}}
.sub{color:#9aa4c8;font-size:16px;margin:22px auto 32px;max-width:540px;line-height:1.7}
.btns{display:flex;gap:18px}
.bp{background:#19e6ff;color:#05060f;border:none;padding:15px 38px;font:700 15px Space Grotesk;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);box-shadow:0 0 22px #19e6ff88;transition:.3s;text-transform:uppercase;letter-spacing:2px}
.bp:hover{box-shadow:0 0 44px #19e6ff}
.bs{background:transparent;color:#ff3cf0;border:1.5px solid #ff3cf0;padding:15px 38px;font:700 15px Space Grotesk;cursor:pointer;transition:.3s;text-transform:uppercase;letter-spacing:2px}
.bs:hover{background:#ff3cf022;box-shadow:0 0 24px #ff3cf066}
.chip{position:absolute;font:400 13px JetBrains Mono;color:#ff3cf0;border:1px solid #ff3cf044;background:#0a0d1e;padding:8px 14px;border-radius:6px;animation:float 4s ease-in-out infinite alternate;z-index:4}
.c1{top:22%;left:10%}.c2{top:30%;right:9%;animation-delay:1s}.c3{bottom:30%;left:14%;animation-delay:.5s}
@keyframes float{to{transform:translateY(-22px)}}
</style></head><body>
<div class="floor"></div><div class="glow"></div><div class="scan"></div>
<nav><div class="logo">NEON_RUN//</div><div class="menu"><a href="#">Jeu</a><a href="#">Classement</a><a href="#">Patch 2.1</a></div></nav>
<div class="hero">
<span class="chip c1 prx" data-d="20">&lt;score&gt; 99 420</span><span class="chip c2 prx" data-d="28">ping: 12ms</span><span class="chip c3 prx" data-d="16">players_online: 48 302</span>
<div class="tagc">[ SAISON 04 — EN LIGNE ]</div>
<h1>COURS DANS LA <b>GRID</b></h1>
<p class="sub">Runner cyberpunk en ligne — esquive les drones, hack les portes, bats le chrono mondial.</p>
<div class="btns"><button class="bp">Jouer gratuit</button><button class="bs">Voir le trailer</button></div>
</div>
<div class="byareej">BY AREEJ ✦</div>
<script>
document.addEventListener("mousemove",function(e){
 var cx=(e.clientX/innerWidth-0.5),cy=(e.clientY/innerHeight-0.5);
 document.querySelectorAll(".prx").forEach(function(el){
  var d=parseFloat(el.dataset.d||10);
  el.style.transform="translate("+(cx*d)+"px,"+(cy*d)+"px)"+(el.dataset.t||"");
 });
});
</script></body></html>
