<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOUD! — BY AREEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Grotesk:wght@400;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}
.byareej{position:fixed;bottom:14px;right:16px;z-index:99;font:600 11px Poppins,sans-serif;letter-spacing:2px;color:#111;opacity:.75}

body{background:#9ef05a;font-family:Space Grotesk,sans-serif;position:relative;border:10px solid #111}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 42px;border-bottom:4px solid #111}
.logo{font:400 26px Archivo Black,sans-serif;color:#111;text-transform:uppercase}
.menu{display:flex;gap:4px}
.menu a{color:#111;text-decoration:none;font-weight:700;font-size:14px;padding:9px 18px;border:3px solid #111;background:#fff;transition:.15s;margin-left:-3px}
.menu a:hover{background:#7a3cf0;color:#fff;transform:translate(-2px,-2px);box-shadow:4px 4px 0 #111}
.hero{height:calc(100% - 180px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
h1{font:400 clamp(60px,9vw,118px)/0.95 Archivo Black,sans-serif;color:#111;text-transform:uppercase;text-shadow:8px 8px 0 #7a3cf0;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.subbox{display:inline-block;background:#fff;border:4px solid #111;box-shadow:8px 8px 0 #111;padding:14px 28px;font-size:17px;font-weight:700;color:#111;margin:30px 0;transform:rotate(-1deg)}
.btns{display:flex;gap:18px}
.bp{background:#111;color:#fff;border:4px solid #111;padding:16px 36px;font:700 16px Space Grotesk;cursor:pointer;transition:.15s;text-transform:uppercase}
.bp:hover{background:#7a3cf0;transform:translate(-3px,-3px);box-shadow:6px 6px 0 #111}
.bs{background:#fff;color:#111;border:4px solid #111;padding:16px 36px;font:700 16px Space Grotesk;cursor:pointer;transition:.15s;text-transform:uppercase}
.bs:hover{transform:translate(-3px,-3px);box-shadow:6px 6px 0 #111}
.stamp{position:absolute;top:8%;right:7%;width:130px;height:130px;background:#ff8a3c;border:4px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 15px Archivo Black;color:#111;text-align:center;animation:spin 9s linear infinite;z-index:6;text-transform:uppercase;line-height:1.2}
@keyframes spin{to{transform:rotate(360deg)}}
.shape{position:absolute;border:4px solid #111;animation:bob 3.4s ease-in-out infinite alternate;z-index:1}
.sq{width:56px;height:56px;background:#7a3cf0;top:20%;left:9%;transform:rotate(14deg)}
.ci{width:64px;height:64px;background:#ff8a3c;border-radius:50%;bottom:26%;right:11%;animation-delay:.9s}
.tr{width:0;height:0;border:none;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:58px solid #111;bottom:22%;left:13%;animation-delay:.4s}
@keyframes bob{to{transform:translateY(-26px) rotate(8deg)}}
.marq{position:absolute;bottom:0;left:0;right:0;background:#111;color:#9ef05a;overflow:hidden;white-space:nowrap;padding:14px 0;border-top:4px solid #111}
.mi{display:inline-block;animation:mq 14s linear infinite;font:400 20px Archivo Black;text-transform:uppercase;letter-spacing:2px}
@keyframes mq{to{transform:translateX(-50%)}}
</style></head><body>
<nav><div class="logo">LOUD!</div><div class="menu"><a href="#">Zine</a><a href="#">Posters</a><a href="#">Studio</a></div></nav>
<div class="hero">
<div class="stamp">ISSUE #12 OUT</div>
<div class="shape sq prx" data-d="24" data-t=" rotate(14deg)"></div><div class="shape ci prx" data-d="16"></div><div class="shape tr prx" data-d="30"></div>
<h1>PRINT IS NOT<br>DEAD!</h1>
<div class="subbox">Zine trimestriel — graphisme brut, interviews, sérigraphies.</div>
<div class="btns"><button class="bp">Numéro 12</button><button class="bs">S'abonner</button></div>
</div>
<div class="marq"><span class="mi">LOUD! ZINE — GRAPHISME BRUT — SÉRIGRAPHIE — PAPIER 300G —  LOUD! ZINE — GRAPHISME BRUT — SÉRIGRAPHIE — PAPIER 300G — </span></div>
<div class="byareej">BY AREEJ ✦</div>
<script>
document.addEventListener("mousemove",function(e){
 var cx=(e.clientX/innerWidth-0.5),cy=(e.clientY/innerHeight-0.5);
 document.querySelectorAll(".prx").forEach(function(el){
  var d=parseFloat(el.dataset.d||10);
  el.style.transform="translate("+(cx*d)+"px,"+(cy*d)+"px)"+(el.dataset.t||"");
 });
});
</script></body></html>
