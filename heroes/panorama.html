<meta name="viewport" content="width=device-width,initial-scale=1"><title>AREEJ Panorama · La Médina en Pop-Up 🏰 BY AREEJ</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Baloo+2:wght@500;700&family=Dancing+Script:wght@700&family=Special+Elite&family=Playfair+Display:wght@600;800&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#f9f4e9,#f1e8d4 55%,#ddcdac)}
.book{--paper:#fbfaf2;--ink:#2a3045;--acc:#B3541E;--line:#d8ddea;--hf:'Dancing Script';--bb:linear-gradient(140deg,#b8422e,#211d18)}
h1{font-family:var(--hf,'Luckiest Guy'),cursive;font-size:34px;margin-bottom:16px;position:relative;z-index:5;color:#26282f;--hf:'Dancing Script';font-size:40px;text-shadow:0 2px 8px #fff}
.cover{background:url('img/pn-00.jpg') center/cover}
.backboard{background:var(--bb,#222);border:2px solid var(--acc)}


.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:560px;height:400px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(280px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
.pg{background:var(--paper);color:var(--ink);padding:22px 20px;display:flex;flex-direction:column}
.pg h2{font-family:var(--hf,inherit);font-size:21px;color:var(--acc);text-align:center;margin-bottom:10px}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 30px,var(--line) 30px 31px);border-radius:4px}
.ft{text-align:center;margin-top:9px;font-size:14px;font-weight:700;color:var(--acc)}
.tk{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:15px}
.tk input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.tk input[type=text]{flex:1;border-bottom:2px dotted var(--line);font-size:14px;color:var(--ink)}
.fld{display:flex;align-items:flex-end;gap:8px;margin:11px 0;font-weight:700;font-size:14px}
.fld input{flex:1;border-bottom:2px dotted var(--line);font-size:14px;color:var(--ink)}
.quote{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;font-size:24px;font-weight:700;font-family:var(--hf,inherit);color:var(--acc)}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:1;align-content:center}
.stk span{aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--acc);display:flex;align-items:center;justify-content:center;font-size:34px;background:rgba(255,255,255,.4)}
.fl2{position:fixed;animation:bob ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-24px) rotate(7deg)}}
.imgp{background-color:#fff!important}
.chk{font-size:13.5px;color:var(--ink);margin:6px 0;text-align:left}
.lin{height:32px;border-bottom:2px dashed var(--line)}
</style></head><style>

</style>

</div></div>
<div class="hint">🖱️ Clique pour ouvrir · clique sur la page de gauche pour revenir — 3 looks + études + ton look 34 à l'intérieur ! 👑</div>
<button class="closebtn" id="seddBtn">↺ Fermer le livre</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();
</script><style>

<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=1180,BH=440;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-400*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
<style>.scene{z-index:60!important}.hint,.closebtn{position:relative;z-index:3}</style></body></html>
