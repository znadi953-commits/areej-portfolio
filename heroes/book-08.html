<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendrier 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}

body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;color:#9c5a74;overflow:hidden;padding:40px 0;background:linear-gradient(160deg,#ffeef5,#ffd6e6 55%,#fbc0d8)}
.pt{position:fixed;animation:fall linear infinite;pointer-events:none;opacity:.7;top:-5vh}
@keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
h1{font-size:34px;color:#e45f94;text-shadow:0 2px 10px #fff;margin-bottom:16px;z-index:5;position:relative}
.cover{background:url('img/b8.jpg') center/cover}
.backboard{background:linear-gradient(140deg,#d4537f,#8e2c50);border:2px solid #ffc9dd}
.pg{background:#fffafc;color:#9c5a74;padding:18px 16px;display:flex;flex-direction:column}
.pg h2{font-size:19px;color:#e45f94;text-align:center;margin-bottom:8px}
.cals{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1}
.cal{border:2px solid #f6b7cf;border-radius:12px;padding:6px;background:#fff}
.mt{text-align:center;font-weight:700;font-size:12.5px;color:#e45f94;margin-bottom:3px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:8.6px;text-align:center}
.grid7 .wd{font-weight:700;color:#c88aa4}
.grid7 .su{color:#e8336e;font-weight:700}
.lin{flex:1;background:repeating-linear-gradient(transparent 0 28px,#f6cedd 28px 29px);border-radius:4px}
.inback{background:linear-gradient(140deg,#c2446f,#6e1f3e);display:flex;align-items:center;justify-content:center;font-size:44px;color:#ffd9e7}

.scene{perspective:2600px;position:relative;z-index:5}
.book{position:relative;width:380px;height:580px;transform-style:preserve-3d;transition:transform 1s ease}
.book.open{transform:translateX(190px)}
.sheet{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;transition:transform 1.1s cubic-bezier(.35,.1,.25,1);cursor:pointer}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.face.back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px}
.backboard{position:absolute;inset:0;border-radius:6px 14px 14px 6px;z-index:1}
.hint{margin-top:24px;text-align:center;font-size:14px;opacity:.9;position:relative;z-index:5}
.closebtn{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:inherit;padding:8px 22px;border-radius:30px;cursor:pointer;font-size:13px;position:relative;z-index:5}
input,textarea{border:0;background:transparent;outline:none;font-family:inherit}
</style></head><body>
<h1>🐾 Calendrier 2027 — Puppy &amp; Kitty Love</h1>
<div class="scene"><div class="book" id="book"><div class="backboard"></div>
<div class="sheet"><div class="face front cover"></div>
 <div class="face back pg"><h2>❄️ Janvier → Avril 🌷</h2><div class="cals"><div class="cal" data-m="0"></div><div class="cal" data-m="1"></div><div class="cal" data-m="2"></div><div class="cal" data-m="3"></div></div></div></div>
<div class="sheet"><div class="face front pg"><h2>🌼 Mai → Août 🌞</h2><div class="cals"><div class="cal" data-m="4"></div><div class="cal" data-m="5"></div><div class="cal" data-m="6"></div><div class="cal" data-m="7"></div></div></div>
 <div class="face back pg"><h2>🍂 Septembre → Décembre 🎄</h2><div class="cals"><div class="cal" data-m="8"></div><div class="cal" data-m="9"></div><div class="cal" data-m="10"></div><div class="cal" data-m="11"></div></div></div></div>
<div class="sheet"><div class="face front pg"><h2>Notes 2027 🐶</h2><div class="lin"></div>
 <div style="text-align:center;margin-top:8px;font-size:14px">Same puppies · Bigger dreams 💗</div></div>
 <div class="face back inback">🐱🐶</div></div>
</div></div>
<div class="hint">🖱️ Klik bash t7ell l book · klik 3la la page lisr bash tsedd</div>
<button class="closebtn" id="seddBtn">↺ Sedd l book</button>
<script>
const sheets=[...document.querySelectorAll('.sheet')];
const book=document.getElementById('book');
function upd(){const n=sheets.filter(s=>s.classList.contains('flipped')).length;
 book.classList.toggle('open',n>0);
 sheets.forEach((s,i)=>{s.style.zIndex=s.classList.contains('flipped')?10+i:100+sheets.length-i;});}
sheets.forEach(s=>{s.addEventListener('click',e=>{
 if(e.target.closest('input,textarea,.noflip'))return;
 const i=sheets.indexOf(s);
 if(!s.classList.contains('flipped')){if(i>0&&!sheets[i-1].classList.contains('flipped'))return;}
 else{if(i<sheets.length-1&&sheets[i+1].classList.contains('flipped'))return;}
 s.classList.toggle('flipped');upd();});});
document.getElementById('seddBtn').addEventListener('click',()=>{sheets.forEach(s=>s.classList.remove('flipped'));upd();});
upd();

const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const EM=['🐱','💗','🌸','🐰','🌼','🐶','🌞','🐻','🍂','🎃','🍁','🎄'];
document.querySelectorAll('.cal').forEach(el=>{const m=+el.dataset.m;
 const start=(new Date(2027,m,1).getDay()+6)%7, days=new Date(2027,m+1,0).getDate();
 let h='<div class="mt">'+EM[m]+' '+MN[m]+'</div><div class="grid7">';
 ['L','M','M','J','V','S','D'].forEach(w=>h+='<span class="wd">'+w+'</span>');
 for(let i=0;i<start;i++)h+='<span></span>';
 for(let x=1;x<=days;x++){h+='<span class="'+(((start+x-1)%7)==6?'su':'')+'">'+x+'</span>';}
 el.innerHTML=h+'</div>';});
for(let i=0;i<10;i++){const s=document.createElement('span');s.className='pt';s.textContent=['🌸','💗','🐾'][i%3];s.style.left=Math.random()*100+'vw';s.style.fontSize=(13+Math.random()*13)+'px';s.style.animationDuration=(7+Math.random()*8)+'s';s.style.animationDelay=(-Math.random()*10)+'s';document.body.appendChild(s);}
</script><style>
/* AUTO-FIT: l book kay tgada m3a ay ecran */
body{overflow:auto!important;justify-content:flex-start!important;align-items:center;padding:14px 0 26px!important;min-height:100vh}
h1{margin-top:4px}
</style>
<script>
(function(){var sc=document.querySelector('.scene');if(!sc)return;
var BW=800,BH=600;
function fit(){var vw=window.innerWidth,vh=window.innerHeight;
 var h1=document.querySelector('h1'),hint=document.querySelector('.hint'),btn=document.querySelector('.closebtn');
 var other=(h1?h1.offsetHeight+22:60)+(hint?hint.offsetHeight+6:40)+(btn?btn.offsetHeight+14:40)+46;
 var s=Math.min(1,(vw-20)/BW,(vh-other)/BH);
 if(s<0.3)s=0.3;
 sc.style.transform='scale('+s+')';
 sc.style.transformOrigin='top center';
 sc.style.marginBottom=(-580*(1-s))+'px';}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',fit);
fit();setTimeout(fit,300);})();
</script>
</body></html>
